function createDogSprite(color1, color2, eyeColor, name, facing, frame, state, scale = 1, frozen = false) {
  const frozenSuffix = frozen ? '-frozen' : '';
  const key = `${name}-${facing}-${frame}-${state}${frozenSuffix}`;
  if (spriteCache[key]) return spriteCache[key];

  const c = document.createElement('canvas');
  c.width = FIGHTER_LAYOUT.spriteSize; c.height = FIGHTER_LAYOUT.spriteSize;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;

  const flip = facing === -1;

  x.save();
  if (flip) { x.translate(FIGHTER_LAYOUT.spriteSize, 0); x.scale(-1, 1); }

  // Frozen state: override colors and stop animations
  const frozenColor1 = frozen ? '#87ceeb' : color1;
  const frozenColor2 = frozen ? '#b0e0e6' : color2;
  const frozenEyeColor = frozen ? '#fff' : eyeColor;

  const bobY = (state === 'idle' && !frozen) ? Math.sin(frame * 0.15) * 2 : 0;

  // Shadow - skip for victory/defeat states (drawn in their blocks)
  if (state !== 'victory' && state !== 'defeat') {
    x.fillStyle = 'rgba(0,0,0,0.3)';
    x.beginPath();
    x.ellipse(60, 112, 28, 6, 0, 0, Math.PI * 2);
    x.fill();
  }

  // Legs (no walk animation when frozen) - skip for victory/defeat
  const legSpread = (state === 'walk' && !frozen) ? Math.sin(frame * 0.3) * 8 : 0;
const isSpecialCrouch = state === 'special' && name === 'TREMODOG';
  const crouchOffset = (state === 'crouch' || isSpecialCrouch) ? 12 : 0;

  const trimColors = getMaskedTrimColors(name, frozen);
  const limbColor = isMaskedFighter(name) ? trimColors.limbColor : color1;
  const pawColor = isMaskedFighter(name) ? trimColors.pawColor : color2;

  // Only draw normal legs if not in victory/defeat state
  if (state !== 'victory' && state !== 'defeat') {
    x.fillStyle = limbColor;
    // Back leg
    x.fillRect(42 - legSpread, 78 + crouchOffset, 10, 28 - crouchOffset);
    // Front leg
    x.fillRect(62 + legSpread, 78 + crouchOffset, 10, 28 - crouchOffset);

    // Paws
    x.fillStyle = pawColor;
    x.fillRect(40 - legSpread, 104 + crouchOffset, 14, 6);
    x.fillRect(60 + legSpread, 104 + crouchOffset, 14, 6);
  }

  // Skip normal body drawing for victory/defeat states
  const isSpecialState = (state === 'victory' || state === 'defeat');

  // Body and head positions (needed for all states)
  const bodyY = 52 + bobY + crouchOffset;
  const headY = bodyY - 8 + ((state === 'crouch' || isSpecialCrouch) ? 8 : 0);

  if (!isSpecialState) {
    // Body
    x.fillStyle = frozenColor1;
    x.beginPath();
    x.ellipse(58, bodyY + 14, 30, 22, 0, 0, Math.PI * 2);
    x.fill();

    // Belly
    x.fillStyle = frozenColor2;
    x.beginPath();
    x.ellipse(58, bodyY + 20, 20, 14, 0, 0, Math.PI * 2);
    x.fill();

    // Tail (no wag when frozen)
    const tailWag = frozen ? 0 : Math.sin(frame * 0.4) * 15;
    x.strokeStyle = frozenColor1;
    x.lineWidth = 6;
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(30, bodyY + 5);
    x.quadraticCurveTo(15, bodyY - 10 + tailWag, 8, bodyY - 20 + tailWag);
    x.stroke();
  x.fillStyle = frozenColor1;
  x.beginPath();
  x.ellipse(70, headY, 22, 20, 0, 0, Math.PI * 2);
  x.fill();

  // Ears
  x.fillStyle = frozenColor1;
  // Left ear (floppy)
  x.beginPath();
  x.ellipse(56, headY - 18, 8, 14, -0.3, 0, Math.PI * 2);
  x.fill();
  // Right ear
  x.beginPath();
  x.ellipse(82, headY - 16, 7, 12, 0.3, 0, Math.PI * 2);
  x.fill();

  // Inner ear
  x.fillStyle = frozen ? '#add8e6' : '#ffb3b3';
  x.beginPath();
  x.ellipse(57, headY - 16, 4, 8, -0.3, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.ellipse(81, headY - 14, 3.5, 7, 0.3, 0, Math.PI * 2);
  x.fill();

  // Snout
  x.fillStyle = frozenColor2;
  x.beginPath();
  x.ellipse(82, headY + 6, 14, 10, 0, 0, Math.PI * 2);
  x.fill();

  // Masked fighter gear: hoodie, mask, vest
  if (isMaskedFighter(name)) {
    const { vestColor, vestHighlight, maskColor, maskEdge } = getMaskedGearColors(name, frozen);

    // Vest on body
    x.fillStyle = vestColor;
    x.beginPath();
    x.ellipse(58, bodyY + 14, 31, 23, 0, 0, Math.PI * 2);
    x.fill();
    // Thick black vertical line in middle of vest
    x.fillStyle = trimColors.centerStripe;
    x.fillRect(51, bodyY - 8, 14, 45);
    // Vest highlights
    x.fillStyle = vestHighlight;
    x.fillRect(48, bodyY + 5, 4, 4);
    x.fillRect(64, bodyY + 5, 4, 4);

    // Black hoodie on head
    x.fillStyle = trimColors.hoodieColor;
    x.beginPath();
    x.ellipse(70, headY, 23, 21, 0, 0, Math.PI * 2);
    x.fill();
    // Hoodie rim
    x.strokeStyle = trimColors.hoodieEdge;
    x.lineWidth = 2;
    x.beginPath();
    x.arc(70, headY, 23, -2.5, -0.6);
    x.stroke();

    // Snout mask
    x.fillStyle = maskColor;
    x.beginPath();
    x.ellipse(82, headY + 6, 15, 11, 0, 0, Math.PI * 2);
    x.fill();
    // Mask edge detail
    x.strokeStyle = maskEdge;
    x.lineWidth = 1;
    x.beginPath();
    x.ellipse(82, headY + 6, 15, 11, 0, -0.5, 1.5);
    x.stroke();

    // Ears on top of hoodie
    x.fillStyle = trimColors.hoodieColor;
    x.beginPath();
    x.ellipse(56, headY - 18, 8, 14, -0.3, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(82, headY - 16, 7, 12, 0.3, 0, Math.PI * 2);
    x.fill();
    x.fillStyle = trimColors.innerEar;
    x.beginPath();
    x.ellipse(57, headY - 16, 4, 8, -0.3, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(81, headY - 14, 3.5, 7, 0.3, 0, Math.PI * 2);
    x.fill();
  }

  // Nose (skip for masked fighters, already drawn with mask)
  if (!isMaskedFighter(name)) {
    x.fillStyle = '#222';
    x.beginPath();
    x.ellipse(90, headY + 2, 5, 4, 0, 0, Math.PI * 2);
    x.fill();
    // Nose shine
    x.fillStyle = 'rgba(255,255,255,0.4)';
    x.beginPath();
    x.ellipse(91, headY, 2, 1.5, 0, 0, Math.PI * 2);
    x.fill();
  }

  // Mouth (skip for masked fighters)
  if (!isMaskedFighter(name)) {
    if (state === 'attack_kick' || state === 'attack_punch' || state === 'special') {
      x.fillStyle = '#333';
      x.beginPath();
      x.ellipse(86, headY + 12, 8, 6, 0, 0, Math.PI * 2);
      x.fill();
      x.fillStyle = '#c0392b';
      x.beginPath();
      x.ellipse(86, headY + 11, 5, 3, 0, 0, Math.PI * 2);
      x.fill();
    } else {
      x.strokeStyle = '#333';
      x.lineWidth = 2;
      x.beginPath();
      x.arc(84, headY + 8, 6, 0, Math.PI);
      x.stroke();
    }

    // Tongue (when idle or happy)
    if (state === 'idle' && frame % 40 < 20) {
      x.fillStyle = '#ff6b8a';
      x.beginPath();
      x.ellipse(88, headY + 15 + Math.sin(frame * 0.2) * 2, 4, 6, 0.2, 0, Math.PI * 2);
      x.fill();
    }
  }

  // Eyes
  x.fillStyle = frozen ? '#e0ffff' : '#fff';
  x.beginPath();
  x.ellipse(68, headY - 6, 7, 8, 0, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.ellipse(80, headY - 6, 6, 7, 0, 0, Math.PI * 2);
  x.fill();

  // Pupils
  const pupilOffset = (state === 'hit' || frozen) ? -2 : 2;
  x.fillStyle = frozenEyeColor;
  x.beginPath();
  x.ellipse(70 + pupilOffset, headY - 5, 4, 5, 0, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.ellipse(82 + pupilOffset, headY - 5, 3.5, 4.5, 0, 0, Math.PI * 2);
  x.fill();

  // Pupil highlights
  x.fillStyle = '#fff';
  x.beginPath();
  x.arc(71 + pupilOffset, headY - 7, 1.5, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.arc(83 + pupilOffset, headY - 7, 1.2, 0, Math.PI * 2);
  x.fill();

  if (isDoggoCage(name)) drawDoggoCageSunglasses(x, headY, frozen);

  // Eyebrows
  if (state === 'hit' || state === 'attack_punch' || state === 'attack_kick' || state === 'special' || frozen) {
    x.strokeStyle = frozenColor1;
    x.lineWidth = 3;
    x.beginPath();
    x.moveTo(62, headY - 16);
    x.lineTo(74, headY - 14);
    x.stroke();
    x.beginPath();
    x.moveTo(75, headY - 14);
    x.lineTo(86, headY - 15);
    x.stroke();
  }

  // Frozen ice crystal effect
  if (frozen) {
    x.strokeStyle = '#87ceeb';
    x.lineWidth = 2;
    x.globalAlpha = 0.6 + Math.sin(frame * 0.2) * 0.2;
    
    // Ice crystals around body
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + frame * 0.02;
      const r = 50 + Math.sin(a * 3) * 5;
      const ix = 60 + Math.cos(a) * r;
      const iy = bodyY + 14 + Math.sin(a) * r * 0.6;
      
      // Crystal shape
      x.beginPath();
      x.moveTo(ix, iy - 8);
      x.lineTo(ix + 4, iy);
      x.lineTo(ix, iy + 8);
      x.lineTo(ix - 4, iy);
      x.closePath();
      x.stroke();
      
      // Crystal fill
      x.fillStyle = 'rgba(135, 206, 235, 0.3)';
      x.fill();
    }
    
    // Frost particles
    x.fillStyle = '#fff';
    for (let i = 0; i < 8; i++) {
      const px = 30 + (i * 15) % 60;
      const py = bodyY + Math.sin(frame * 0.1 + i) * 20;
      x.globalAlpha = 0.4 + Math.sin(frame * 0.15 + i * 0.5) * 0.3;
      x.beginPath();
      x.arc(px, py, 2, 0, Math.PI * 2);
      x.fill();
    }
    
    x.globalAlpha = 1;
  }

  // Attack effects
  if (state === 'attack_punch') {
    const punchFrame = frame % 6;
    // Front paw extended
    x.fillStyle = color1;
    x.save();
    x.translate(95, bodyY + 5);
    x.rotate(-0.3);
    x.fillRect(-5, -5, 22 + punchFrame * 3, 10);
    x.fillStyle = color2;
    x.fillRect(14 + punchFrame * 3, -7, 12, 14);
    // Paw pads
    x.fillStyle = '#ffb3b3';
    x.beginPath();
    x.arc(22 + punchFrame * 3, 0, 3, 0, Math.PI * 2);
    x.fill();
    x.restore();

    // Impact lines
    x.strokeStyle = '#f1c40f';
    x.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = -0.5 + i * 0.5;
      x.beginPath();
      x.moveTo(108 + punchFrame * 3, bodyY + 5 + Math.sin(a) * 10);
      x.lineTo(115 + punchFrame * 3, bodyY + 5 + Math.sin(a) * 18);
      x.stroke();
    }
  }

  if (state === 'attack_kick') {
    const kickFrame = frame % 8;
    x.fillStyle = color1;
    x.save();
    x.translate(85, bodyY + 25);
    x.rotate(-0.8 + kickFrame * 0.15);
    x.fillRect(-5, -5, 30, 10);
    x.fillStyle = color2;
    x.fillRect(22, -7, 14, 14);
    x.fillStyle = '#ffb3b3';
    x.beginPath();
    x.arc(30, 0, 3, 0, Math.PI * 2);
    x.fill();
    x.restore();

    x.strokeStyle = '#e74c3c';
    x.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = -0.6 + i * 0.4;
      const kx = 105 + kickFrame * 2;
      x.beginPath();
      x.moveTo(kx, bodyY + 30 + Math.sin(a) * 8);
      x.lineTo(kx + 8, bodyY + 30 + Math.sin(a) * 16);
      x.stroke();
    }
  }

  if (state === 'special') {
    if (name === 'SKORPDOG') {
      const harpoonX = 102;
      const harpoonY = bodyY + 1;
      x.strokeStyle = '#888';
      x.lineWidth = 3;
      x.setLineDash([4, 3]);
      x.beginPath();
      x.moveTo(82, bodyY + 3);
      x.lineTo(harpoonX, harpoonY);
      x.stroke();
      x.setLineDash([]);

      x.fillStyle = '#c0c0c0';
      x.beginPath();
      x.moveTo(harpoonX + 10, harpoonY);
      x.lineTo(harpoonX, harpoonY - 6);
      x.lineTo(harpoonX - 6, harpoonY);
      x.lineTo(harpoonX, harpoonY + 6);
      x.closePath();
      x.fill();

      x.strokeStyle = '#888';
      x.lineWidth = 2;
      x.stroke();

      x.fillStyle = '#fff';
      x.beginPath();
      x.arc(harpoonX + 1, harpoonY, 2, 0, Math.PI * 2);
      x.fill();
    } else if (name === 'CYDOG') {
      const netFrame = frame % 10;
      const netX = 96 + netFrame * 2;
      const netY = bodyY + 2;
      x.strokeStyle = '#2ecc71';
      x.lineWidth = 2;
      x.beginPath();
      x.arc(netX, netY, 10, 0, Math.PI * 2);
      x.stroke();

      for (let i = 0; i < 4; i++) {
        x.save();
        x.translate(netX, netY);
        x.rotate((i / 4) * Math.PI / 2 + frame * 0.05);
        x.beginPath();
        x.moveTo(-8, 0);
        x.lineTo(8, 0);
        x.stroke();
        x.restore();
      }

      x.fillStyle = '#f1c40f';
      x.beginPath();
      x.arc(78, bodyY + 16, 7, 0, Math.PI * 2);
      x.fill();
    } else if (name === 'BORKO') {
      x.strokeStyle = '#74b9ff';
      x.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        const trailX = 44 + i * 16;
        x.beginPath();
        x.moveTo(trailX, bodyY + 30);
        x.lineTo(trailX - 8, bodyY + 58);
        x.stroke();
      }

      x.fillStyle = '#dfe6e9';
      x.beginPath();
      x.arc(82, bodyY - 12, 7, 0, Math.PI * 2);
      x.arc(94, bodyY - 2, 5, 0, Math.PI * 2);
      x.fill();
    } else if (name === 'TREMODOG') {
      x.strokeStyle = '#ff7de9';
      x.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const waveY = bodyY + 30 + i * 6;
        x.beginPath();
        x.moveTo(28, waveY);
        x.quadraticCurveTo(46, waveY - 4, 62, waveY);
        x.quadraticCurveTo(78, waveY + 4, 94, waveY);
        x.stroke();
      }
    } else {
      const sf = frame % 12;
      const ballX = 95 + sf * 4;
      const ballY = bodyY;
      const grad = x.createRadialGradient(ballX, ballY, 0, ballX, ballY, 20);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.3, isDoggoCage(name) ? '#f1c40f' : (name === 'SEKDOG' ? '#ff7675' : '#3498db'));
      grad.addColorStop(0.7, isDoggoCage(name) ? '#e74c3c' : (name === 'SEKDOG' ? '#c0392b' : '#9b59b6'));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = grad;
      x.beginPath();
      x.arc(ballX, ballY, 18 - sf, 0, Math.PI * 2);
      x.fill();

      x.strokeStyle = '#f1c40f';
      x.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + frame * 0.2;
        x.beginPath();
        x.moveTo(ballX + Math.cos(a) * 10, ballY + Math.sin(a) * 10);
        x.lineTo(ballX + Math.cos(a) * (18 + sf), ballY + Math.sin(a) * (18 + sf));
        x.stroke();
      }
    }
  }

  // Hit effect
  if (state === 'hit') {
    x.strokeStyle = '#f1c40f';
    x.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + frame * 0.3;
      const r = 35 + (frame % 4) * 5;
      x.beginPath();
      x.moveTo(60 + Math.cos(a) * (r - 8), bodyY + Math.sin(a) * (r - 8));
      x.lineTo(60 + Math.cos(a) * r, bodyY + Math.sin(a) * r);
      x.stroke();
    }
  }

  if (state === 'stunned') {
    x.strokeStyle = '#f39c12';
    x.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + frame * 0.12;
      const sx = 60 + Math.cos(a) * 24;
      const sy = headY - 24 + Math.sin(a) * 8;
      drawStar(x, sx, sy, 4, '#f1c40f');
    }
  }

  // KO effect
  if (state === 'ko') {
    x.strokeStyle = '#888';
    x.lineWidth = 2;
    // Stars circling
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + frame * 0.1;
      const sx = 60 + Math.cos(a) * 30;
      const sy = headY - 30 + Math.sin(a) * 10;
      drawStar(x, sx, sy, 5, '#f1c40f');
    }
  }

  // Block stance
  if (state === 'block') {
    x.fillStyle = 'rgba(100,200,255,0.3)';
    x.beginPath();
    x.ellipse(65, bodyY, 35, 30, 0, 0, Math.PI * 2);
    x.fill();
    x.strokeStyle = 'rgba(100,200,255,0.6)';
    x.lineWidth = 2;
    x.stroke();
  }
  } // End of isSpecialState check

  // Victory pose effect
  if (state === 'victory') {
    // Jumping animation - entire character bounces
    const jumpOffset = Math.abs(Math.sin(frame * 0.15)) * 20;

    // Local body/head positions with jump offset
    const vicBodyY = bodyY - jumpOffset;
    const vicHeadY = headY - jumpOffset;

    // Shadow (stays on ground)
    x.fillStyle = 'rgba(0,0,0,0.3)';
    x.beginPath();
    x.ellipse(60, 112, 28, 6, 0, 0, Math.PI * 2);
    x.fill();

    // Legs spread during jump
    x.fillStyle = limbColor;
    x.fillRect(42 - jumpOffset * 0.3, 78, 10, 28);
    x.fillRect(62 + jumpOffset * 0.3, 78, 10, 28);
    // Paws
    x.fillStyle = pawColor;
    x.fillRect(40 - jumpOffset * 0.3, 104, 14, 6);
    x.fillRect(60 + jumpOffset * 0.3, 104, 14, 6);

    // Body
    x.fillStyle = frozenColor1;
    x.beginPath();
    x.ellipse(58, vicBodyY + 14, 30, 22, 0, 0, Math.PI * 2);
    x.fill();

    // Belly
    x.fillStyle = frozenColor2;
    x.beginPath();
    x.ellipse(58, vicBodyY + 20, 20, 14, 0, 0, Math.PI * 2);
    x.fill();

    // Tail
    const tailWag2 = Math.sin(frame * 0.4) * 15;
    x.strokeStyle = frozenColor1;
    x.lineWidth = 6;
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(30, vicBodyY + 5);
    x.quadraticCurveTo(15, vicBodyY - 10 + tailWag2, 8, vicBodyY - 20 + tailWag2);
    x.stroke();

    // Head at new position
    x.fillStyle = frozenColor1;
    x.beginPath();
    x.ellipse(70, vicHeadY, 22, 20, 0, 0, Math.PI * 2);
    x.fill();

    // Ears
    x.fillStyle = frozenColor1;
    x.beginPath();
    x.ellipse(56, vicHeadY - 18, 8, 14, -0.3, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(82, vicHeadY - 16, 7, 12, 0.3, 0, Math.PI * 2);
    x.fill();

    // Inner ear
    x.fillStyle = '#ffb3b3';
    x.beginPath();
    x.ellipse(57, vicHeadY - 16, 4, 8, -0.3, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(81, vicHeadY - 14, 3.5, 7, 0.3, 0, Math.PI * 2);
    x.fill();

    // Snout
    x.fillStyle = frozenColor2;
    x.beginPath();
    x.ellipse(82, vicHeadY + 6, 14, 10, 0, 0, Math.PI * 2);
    x.fill();

    // Nose
    if (!isMaskedFighter(name)) {
      x.fillStyle = '#222';
      x.beginPath();
      x.ellipse(90, vicHeadY + 2, 5, 4, 0, 0, Math.PI * 2);
      x.fill();
      x.fillStyle = 'rgba(255,255,255,0.4)';
      x.beginPath();
      x.ellipse(91, vicHeadY, 2, 1.5, 0, 0, Math.PI * 2);
      x.fill();
    }

    // Masked fighter gear
    if (isMaskedFighter(name)) {
      const { vestColor, vestHighlight, maskColor, maskEdge } = getMaskedGearColors(name, frozen);

      // Vest on body
      x.fillStyle = vestColor;
      x.beginPath();
      x.ellipse(58, vicBodyY + 14, 31, 23, 0, 0, Math.PI * 2);
      x.fill();
      x.fillStyle = trimColors.centerStripe;
      x.fillRect(51, vicBodyY - 8, 14, 45);
      x.fillStyle = vestHighlight;
      x.fillRect(48, vicBodyY + 5, 4, 4);
      x.fillRect(64, vicBodyY + 5, 4, 4);

      // Black hoodie on head
      x.fillStyle = trimColors.hoodieColor;
      x.beginPath();
      x.ellipse(70, vicHeadY, 23, 21, 0, 0, Math.PI * 2);
      x.fill();
      x.strokeStyle = trimColors.hoodieEdge;
      x.lineWidth = 2;
      x.beginPath();
      x.arc(70, vicHeadY, 23, -2.5, -0.6);
      x.stroke();

      // Snout mask
      x.fillStyle = maskColor;
      x.beginPath();
      x.ellipse(82, vicHeadY + 6, 15, 11, 0, 0, Math.PI * 2);
      x.fill();
      x.strokeStyle = maskEdge;
      x.lineWidth = 1;
      x.beginPath();
      x.ellipse(82, vicHeadY + 6, 15, 11, 0, -0.5, 1.5);
      x.stroke();

      // Ears on top of hoodie
      x.fillStyle = trimColors.hoodieColor;
      x.beginPath();
      x.ellipse(56, vicHeadY - 18, 8, 14, -0.3, 0, Math.PI * 2);
      x.fill();
      x.beginPath();
      x.ellipse(82, vicHeadY - 16, 7, 12, 0.3, 0, Math.PI * 2);
      x.fill();
      x.fillStyle = trimColors.innerEar;
      x.beginPath();
      x.ellipse(57, vicHeadY - 16, 4, 8, -0.3, 0, Math.PI * 2);
      x.fill();
      x.beginPath();
      x.ellipse(81, vicHeadY - 14, 3.5, 7, 0.3, 0, Math.PI * 2);
      x.fill();
    }

    // Both arms waving
    // Left arm
    x.fillStyle = limbColor;
    x.save();
    x.translate(35, vicBodyY - 5);
    x.rotate(0.5 + Math.sin(frame * 0.2) * 0.4);
    x.fillRect(-5, -25, 10, 25);
    x.fillStyle = pawColor;
    x.fillRect(-7, -33, 14, 12);
    x.restore();

    // Right arm
    x.fillStyle = limbColor;
    x.save();
    x.translate(85, vicBodyY - 5);
    x.rotate(-0.5 + Math.sin(frame * 0.2 + Math.PI) * 0.4);
    x.fillRect(-5, -25, 10, 25);
    x.fillStyle = pawColor;
    x.fillRect(-7, -33, 14, 12);
    // Paw pads
    x.fillStyle = '#ffb3b3';
    x.beginPath();
    x.arc(0, -33, 3, 0, Math.PI * 2);
    x.fill();
    x.restore();

    // Legs spread during jump
    x.fillStyle = limbColor;
    x.fillRect(42 - jumpOffset * 0.3, 78, 10, 28);
    x.fillRect(62 + jumpOffset * 0.3, 78, 10, 28);
    // Paws
    x.fillStyle = pawColor;
    x.fillRect(40 - jumpOffset * 0.3, 104, 14, 6);
    x.fillRect(60 + jumpOffset * 0.3, 104, 14, 6);

    // Eyes
    x.fillStyle = '#fff';
    x.beginPath();
    x.ellipse(68, vicHeadY - 6, 7, 8, 0, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(80, vicHeadY - 6, 6, 7, 0, 0, Math.PI * 2);
    x.fill();

    // Pupils
    x.fillStyle = eyeColor;
    x.beginPath();
    x.ellipse(70, vicHeadY - 5, 4, 5, 0, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(82, vicHeadY - 5, 3.5, 4.5, 0, 0, Math.PI * 2);
    x.fill();

    // Pupil highlights
    x.fillStyle = '#fff';
    x.beginPath();
    x.arc(71, vicHeadY - 7, 1.5, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.arc(83, vicHeadY - 7, 1.2, 0, Math.PI * 2);
    x.fill();

    if (isDoggoCage(name)) drawDoggoCageSunglasses(x, vicHeadY, frozen);

    // Victory stars/sparkles
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + frame * 0.08;
      const r = 45 + Math.sin(a * 2 + frame * 0.1) * 10;
      const sx = 60 + Math.cos(a) * r;
      const sy = vicBodyY + 14 + Math.sin(a) * r * 0.7;
      const starSize = 3 + Math.sin(frame * 0.2 + i) * 2;
      drawStar(x, sx, sy, starSize, '#f1c40f');
    }

    // Happy mouth (open smile)
    if (!isMaskedFighter(name)) {
      x.strokeStyle = '#333';
      x.lineWidth = 2;
      x.beginPath();
      x.arc(84, vicHeadY + 8, 8, 0, Math.PI);
      x.stroke();
      x.fillStyle = '#c0392b';
      x.beginPath();
      x.ellipse(84, vicHeadY + 12, 5, 3, 0, 0, Math.PI * 2);
      x.fill();
    }

    // Raised eyebrows for happy expression
    x.strokeStyle = frozenColor1;
    x.lineWidth = 3;
    x.beginPath();
    x.moveTo(62, vicHeadY - 20);
    x.lineTo(74, vicHeadY - 18);
    x.stroke();
    x.beginPath();
    x.moveTo(75, vicHeadY - 18);
    x.lineTo(86, vicHeadY - 19);
    x.stroke();
  }

  // Defeat/death pose effect - crouching with X eyes
  if (state === 'defeat') {
    // Crouch offset - body squats down
    const crouchAmt = 15;

    // Shadow (stays on ground)
    x.fillStyle = 'rgba(0,0,0,0.3)';
    x.beginPath();
    x.ellipse(60, 112, 28, 6, 0, 0, Math.PI * 2);
    x.fill();

    // Legs (crouched)
    x.fillStyle = limbColor;
    x.fillRect(42, 78 + crouchAmt, 10, 28 - crouchOffset);
    x.fillRect(62, 78 + crouchAmt, 10, 28 - crouchOffset);
    // Paws
    x.fillStyle = pawColor;
    x.fillRect(40, 104 + crouchAmt, 14, 6);
    x.fillRect(60, 104 + crouchAmt, 14, 6);

    // Body (crouched)
    const defBodyY = bodyY + crouchAmt;
    x.fillStyle = frozenColor1;
    x.beginPath();
    x.ellipse(58, defBodyY + 14, 30, 22, 0, 0, Math.PI * 2);
    x.fill();

    // Belly
    x.fillStyle = frozenColor2;
    x.beginPath();
    x.ellipse(58, defBodyY + 20, 20, 14, 0, 0, Math.PI * 2);
    x.fill();

    // Tail (drooping)
    x.strokeStyle = frozenColor1;
    x.lineWidth = 6;
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(30, defBodyY + 5);
    x.quadraticCurveTo(15, defBodyY + 10, 8, defBodyY + 15);
    x.stroke();

    // Head (crouched)
    const defHeadY = headY + crouchAmt;
    x.fillStyle = frozenColor1;
    x.beginPath();
    x.ellipse(70, defHeadY, 22, 20, 0, 0, Math.PI * 2);
    x.fill();

    // Ears
    x.fillStyle = frozenColor1;
    x.beginPath();
    x.ellipse(56, defHeadY - 18, 8, 14, -0.3, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(82, defHeadY - 16, 7, 12, 0.3, 0, Math.PI * 2);
    x.fill();

    // Inner ear
    x.fillStyle = '#ffb3b3';
    x.beginPath();
    x.ellipse(57, defHeadY - 16, 4, 8, -0.3, 0, Math.PI * 2);
    x.fill();
    x.beginPath();
    x.ellipse(81, defHeadY - 14, 3.5, 7, 0.3, 0, Math.PI * 2);
    x.fill();

    if (isDoggoCage(name)) drawDoggoCageSunglasses(x, defHeadY, frozen);

    // Snout
    x.fillStyle = frozenColor2;
    x.beginPath();
    x.ellipse(82, defHeadY + 6, 14, 10, 0, 0, Math.PI * 2);
    x.fill();

    // Nose
    if (!isMaskedFighter(name)) {
      x.fillStyle = '#222';
      x.beginPath();
      x.ellipse(90, defHeadY + 2, 5, 4, 0, 0, Math.PI * 2);
      x.fill();
    }

    // Masked fighter gear
    if (isMaskedFighter(name)) {
      const { vestColor, vestHighlight, maskColor, maskEdge } = getMaskedGearColors(name, frozen);

      // Vest on body
      x.fillStyle = vestColor;
      x.beginPath();
      x.ellipse(58, defBodyY + 14, 31, 23, 0, 0, Math.PI * 2);
      x.fill();
      x.fillStyle = trimColors.centerStripe;
      x.fillRect(51, defBodyY - 8, 14, 45);
      x.fillStyle = vestHighlight;
      x.fillRect(48, defBodyY + 5, 4, 4);
      x.fillRect(64, defBodyY + 5, 4, 4);

      // Black hoodie on head
      x.fillStyle = trimColors.hoodieColor;
      x.beginPath();
      x.ellipse(70, defHeadY, 23, 21, 0, 0, Math.PI * 2);
      x.fill();
      x.strokeStyle = trimColors.hoodieEdge;
      x.lineWidth = 2;
      x.beginPath();
      x.arc(70, defHeadY, 23, -2.5, -0.6);
      x.stroke();

      // Snout mask
      x.fillStyle = maskColor;
      x.beginPath();
      x.ellipse(82, defHeadY + 6, 15, 11, 0, 0, Math.PI * 2);
      x.fill();
      x.strokeStyle = maskEdge;
      x.lineWidth = 1;
      x.beginPath();
      x.ellipse(82, defHeadY + 6, 15, 11, 0, -0.5, 1.5);
      x.stroke();

      // Ears on top of hoodie
      x.fillStyle = trimColors.hoodieColor;
      x.beginPath();
      x.ellipse(56, defHeadY - 18, 8, 14, -0.3, 0, Math.PI * 2);
      x.fill();
      x.beginPath();
      x.ellipse(82, defHeadY - 16, 7, 12, 0.3, 0, Math.PI * 2);
      x.fill();
      x.fillStyle = trimColors.innerEar;
      x.beginPath();
      x.ellipse(57, defHeadY - 16, 4, 8, -0.3, 0, Math.PI * 2);
      x.fill();
      x.beginPath();
      x.ellipse(81, defHeadY - 14, 3.5, 7, 0.3, 0, Math.PI * 2);
      x.fill();
    }

    // Arms (drooping)
    x.fillStyle = limbColor;
    x.fillRect(25, defBodyY, 10, 25);
    x.fillRect(85, defBodyY, 10, 25);
    // Paws
    x.fillStyle = pawColor;
    x.fillRect(23, defBodyY + 23, 14, 6);
    x.fillRect(83, defBodyY + 23, 14, 6);

    // X eyes (dead)
    x.strokeStyle = '#333';
    x.lineWidth = 3;
    // Left X
    x.beginPath();
    x.moveTo(63, defHeadY - 9);
    x.lineTo(73, defHeadY - 1);
    x.stroke();
    x.beginPath();
    x.moveTo(73, defHeadY - 9);
    x.lineTo(63, defHeadY - 1);
    x.stroke();
    // Right X
    x.beginPath();
    x.moveTo(75, defHeadY - 9);
    x.lineTo(85, defHeadY - 1);
    x.stroke();
    x.beginPath();
    x.moveTo(85, defHeadY - 9);
    x.lineTo(75, defHeadY - 1);
    x.stroke();

    // Tongue sticking out
    if (!isMaskedFighter(name)) {
      x.fillStyle = '#ff6b8a';
      x.beginPath();
      x.ellipse(86, defHeadY + 18, 4, 8, 0.3, 0, Math.PI * 2);
      x.fill();
    }

    // Stars circling head
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + frame * 0.1;
      const sx = 60 + Math.cos(a) * 30;
      const sy = defHeadY - 25 + Math.sin(a) * 10;
      drawStar(x, sx, sy, 5, '#888');
    }
  }

  x.restore();

  spriteCache[key] = c;
  return c;
}

function drawStar(x, cx, cy, r, color) {
  x.fillStyle = color;
  x.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    x[method](cx + r * Math.cos(a), cy + r * Math.sin(a));
  }
  x.closePath();
  x.fill();
}

class Fighter {
  constructor(x, char, facing) {
    this.x = x;
    this.y = GROUND;
    this.vx = 0;
    this.vy = 0;
    this.name = char.name;
    this.color1 = char.color1;
    this.color2 = char.color2;
    this.eyeColor = char.eyeColor;
    this.speed = char.speed;
    this.scale = char.scale || 1;
    this.specialGain = char.specialGain;
    this.maxHealth = char.health;
    this.facing = facing;
    this.health = char.health;
    this.special = 0;
    this.state = 'idle';
    this.frame = 0;
    this.attackTimer = 0;
    this.hitTimer = 0;
    this.blockTimer = 0;
    this.comboCount = 0;
    this.lastHitTime = 0;
    this.isBlocking = false;
    this.isCrouching = false;
    this.onGround = true;
    this.width = FIGHTER_LAYOUT.width * this.scale;
    this.height = FIGHTER_LAYOUT.height * this.scale;
    this.roundsWon = 0;
    this.hitCooldown = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.lastAttackType = '';
    this.freezeTimer = 0;
    this.stunnedTimer = 0;
    this.victoryTimer = 0;
    this.defeatTimer = 0;
    this.victoryPose = 0;
    this.teleportPhase = '';
    this.teleportPhaseTimer = 0;
    this.teleportOffset = 0;
    this.teleportPunchDone = false;
    this.harpoonLockTimer = 0;
    this.borkoImpactX = x;
    this.borkoImpactY = GROUND - 24;
    this.borkoLeapActive = false;
    this.borkoLeapStartX = x;
  }

  reset(x) {
    this.x = x;
    this.y = GROUND;
    this.vx = 0;
    this.vy = 0;
    this.health = this.maxHealth;
    this.special = 0;
    this.state = 'idle';
    this.frame = 0;
    this.attackTimer = 0;
    this.hitTimer = 0;
    this.blockTimer = 0;
    this.comboCount = 0;
    this.isBlocking = false;
    this.isCrouching = false;
    this.onGround = true;
    this.hitCooldown = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.freezeTimer = 0;
    this.stunnedTimer = 0;
    this.victoryTimer = 0;
    this.defeatTimer = 0;
    this.victoryPose = 0;
    this.teleportPhase = '';
    this.teleportPhaseTimer = 0;
    this.teleportOffset = 0;
    this.teleportPunchDone = false;
    this.harpoonLockTimer = 0;
    this.borkoImpactX = x;
    this.borkoImpactY = GROUND - 24;
    this.borkoLeapActive = false;
    this.borkoLeapStartX = x;
  }

  getHurtbox() {
    if (this.teleportPhase && this.teleportPhase !== 'strike') {
      return { x: -9999, y: -9999, w: 0, h: 0 };
    }

    const crouch = this.isCrouching ? 20 : 0;
    return {
      x: this.x - this.width / 2,
      y: this.y - this.height + crouch,
      w: this.width,
      h: this.height - crouch
    };
  }

  getAttackBox() {
    if (this.freezeTimer > 0) return null;
    if (this.stunnedTimer > 0) return null;
    if (this.attackTimer <= 0) return null;
    const comboStage = Math.floor(this.comboCount / 3);
    if (this.lastAttackType === 'punch') {
      return {
        x: this.x + this.facing * COMBAT.punch.hitbox.xOffset,
        y: this.y - COMBAT.punch.hitbox.yOffset + (this.isCrouching ? COMBAT.punch.hitbox.crouchOffset : 0),
        w: COMBAT.punch.hitbox.width,
        h: COMBAT.punch.hitbox.height,
        dmg: COMBAT.punch.damage + comboStage * COMBAT.punch.comboDamageStep,
        kb: COMBAT.punch.knockback + this.comboCount * COMBAT.punch.comboKnockbackStep
      };
    } else if (this.lastAttackType === 'kick') {
      return {
        x: this.x + this.facing * COMBAT.kick.hitbox.xOffset,
        y: this.y - COMBAT.kick.hitbox.yOffset + (this.isCrouching ? COMBAT.kick.hitbox.crouchOffset : 0),
        w: COMBAT.kick.hitbox.width,
        h: COMBAT.kick.hitbox.height,
        dmg: COMBAT.kick.damage + comboStage * COMBAT.kick.comboDamageStep,
        kb: COMBAT.kick.knockback
      };
    }
    return null;
  }

  attack(type) {
    if (this.freezeTimer > 0) return;
    if (this.stunnedTimer > 0) return;
    if (this.harpoonLockTimer > 0) return;
    if (this.attackTimer > 0 || this.hitTimer > 0) return;
    if (type === 'special' && this.special < SPECIAL_METER_MAX) return;

    this.lastAttackType = type;
    if (type === 'punch') {
      this.state = 'attack_punch';
      this.attackTimer = COMBAT.punch.duration;
    } else if (type === 'kick') {
      this.state = 'attack_kick';
      this.attackTimer = COMBAT.kick.duration;
    } else if (type === 'special') {
      this.state = 'special';
      if (this.name === 'SEKDOG') {
        this.attackTimer = COMBAT.special.sekdog.descendFrames + COMBAT.special.sekdog.riseFrames + COMBAT.special.sekdog.punchFrames;
        this.teleportPhase = 'descend';
        this.teleportPhaseTimer = COMBAT.special.sekdog.descendFrames;
        this.teleportOffset = 0;
        this.teleportPunchDone = false;
      } else if (this.name === 'BORKO') {
        const opponent = this === p1 ? p2 : p1;
        const special = COMBAT.special.borko;
        this.attackTimer = special.airFrames;
        this.borkoImpactX = Math.max(
          FIGHTER_LAYOUT.boundaryPadding,
          Math.min(W - FIGHTER_LAYOUT.boundaryPadding, opponent.x)
        );
        this.borkoImpactY = GROUND - 24;
        this.borkoLeapActive = true;
        this.borkoLeapStartX = this.x;
        this.facing = this.borkoImpactX >= this.x ? 1 : -1;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.isBlocking = false;
        this.isCrouching = false;
      } else {
        this.attackTimer = COMBAT.special.duration;
      }
      this.special = 0;
      spawnProjectile(this);
      if (this.name === 'CYDOG') {
        this.attackTimer = 0;
        this.state = 'idle';
      }
    }

    playAttackSound(type);
    this.frame = 0;
  }

  takeHit(dmg, kb, attackerFacing) {
    if (this.hitCooldown > 0) return;
    if (this.isBlocking) {
      dmg = Math.floor(dmg * COMBAT.block.damageMultiplier);
      kb *= COMBAT.block.knockbackMultiplier;
      this.blockTimer = COMBAT.block.stunFrames;
      addParticle(this.x + attackerFacing * 30, this.y - 50, 'block');
      playImpactSound('block');
    } else {
      this.hitTimer = COMBAT.hit.stunFrames;
      this.state = 'hit';
      this.frame = 0;
      this.shakeX = attackerFacing * 8;
      addParticle(this.x + attackerFacing * 30, this.y - 50, 'hit');
      playImpactSound('hit');
    }

    this.health = Math.max(0, this.health - dmg);
    this.vx = attackerFacing * kb;
    if (!this.onGround) this.vy = PHYSICS.airborneHitLift;
    this.hitCooldown = COMBAT.hit.cooldownFrames;
    this.special = Math.min(SPECIAL_METER_MAX, this.special + dmg * COMBAT.meter.onHurtMultiplier);
  }

  applyStunnedStatus(durationMs) {
    this.stunnedTimer = durationMs;
    this.attackTimer = 0;
    this.lastAttackType = '';
    this.blockTimer = 0;
    this.isBlocking = false;
    this.hitTimer = 0;
    this.state = 'stunned';
    this.vx = 0;
    this.vy = 0;
  }

  landBorkoShockwave(opponent) {
    const special = COMBAT.special.borko;
    const shockX = this.borkoImpactX;
    const shockY = this.borkoImpactY;
    const opponentCenterY = opponent.y - opponent.height / 2;
    const caught = Math.hypot(opponent.x - shockX, opponentCenterY - shockY) <= special.shockRadius;

    particles.push({
      x: shockX,
      y: shockY,
      vx: 0,
      vy: 0,
      life: 24,
      maxLife: 24,
      radius: special.shockRadius,
      type: 'borkoShockwave'
    });
    addParticle(shockX, shockY, 'hit');
    addParticle(shockX - 28, shockY + 8, 'hit');
    addParticle(shockX + 28, shockY + 8, 'hit');
    game.screenShake = COMBAT.effects.projectileShake;
    game.hitStop = COMBAT.effects.projectileHitStop;

    if (caught) {
      opponent.takeHit(special.shockDamage, special.shockKnockback, this.facing);
      if (opponent.health > 0) opponent.applyStunnedStatus(special.shockStunMs);
      addParticle(opponent.x, opponent.y - 50, 'stunned');
      if (opponent.health <= 0) playImpactSound('ko');
    } else {
      playImpactSound('hit');
    }

    this.borkoLeapActive = false;
    this.attackTimer = 0;
    this.state = 'idle';
    this.vx = 0;
    this.vy = 0;
  }

  updateBorkoSpecial(opponent) {
    const special = COMBAT.special.borko;
    this.state = 'special';
    this.isBlocking = false;
    this.isCrouching = false;
    this.onGround = false;
    this.vx = 0;
    this.vy = 0;

    const elapsedFrames = special.airFrames - this.attackTimer + 1;
    const progress = Math.min(1, elapsedFrames / special.airFrames);
    this.x = this.borkoLeapStartX + (this.borkoImpactX - this.borkoLeapStartX) * progress;
    this.y = GROUND - Math.sin(progress * Math.PI) * special.jumpHeight;
    this.attackTimer = Math.max(0, this.attackTimer - 1);

    if (progress >= 1 || this.attackTimer <= 0) {
      this.x = this.borkoImpactX;
      this.y = GROUND;
      this.onGround = true;
      this.landBorkoShockwave(opponent);
    }
  }

  landSekdogTeleportPunch(opponent) {
    if (opponent.health <= 0) return;

    const punch = COMBAT.special.sekdog;
    opponent.takeHit(punch.punchDamage, punch.punchKnockback, this.facing);
    addParticle(opponent.x - this.facing * 18, opponent.y - 50, 'hit');

    if (opponent.health <= 0) {
      game.screenShake = COMBAT.effects.koShake;
      addParticle(opponent.x, opponent.y - 50, 'ko');
      playImpactSound('ko');
    } else {
      game.screenShake = COMBAT.effects.hitShake;
    }

    game.hitStop = COMBAT.effects.meleeHitStop;
  }

  updateSekdogTeleport(opponent) {
    const special = COMBAT.special.sekdog;

    this.vx = 0;
    this.vy = 0;
    this.onGround = true;
    this.isBlocking = false;
    this.isCrouching = false;
    this.attackTimer = Math.max(0, this.attackTimer - 1);

    if (this.teleportPhase === 'descend') {
      this.state = 'special';
      this.teleportOffset += (H + FIGHTER_LAYOUT.spriteSize) / special.descendFrames;
      this.teleportPhaseTimer--;

      if (this.teleportPhaseTimer <= 0) {
        this.teleportPhase = 'reappear';
        this.teleportPhaseTimer = special.riseFrames;
        this.teleportOffset = H;
        this.facing = opponent.facing;
        this.x = Math.max(
          FIGHTER_LAYOUT.boundaryPadding,
          Math.min(W - FIGHTER_LAYOUT.boundaryPadding, opponent.x - opponent.facing * special.behindOffset)
        );
        this.frame = 0;
      }
      return;
    }

    if (this.teleportPhase === 'reappear') {
      this.state = 'special';
      this.teleportOffset = Math.max(0, this.teleportOffset - H / special.riseFrames);
      this.teleportPhaseTimer--;

      if (this.teleportPhaseTimer <= 0) {
        this.teleportPhase = 'strike';
        this.teleportPhaseTimer = special.punchFrames;
        this.teleportOffset = 0;
        this.teleportPunchDone = false;
        this.state = 'attack_punch';
        this.frame = 0;
      }
      return;
    }

    if (this.teleportPhase === 'strike') {
      this.state = 'attack_punch';
      if (!this.teleportPunchDone && this.teleportPhaseTimer <= special.punchFrames - 2) {
        this.teleportPunchDone = true;
        this.landSekdogTeleportPunch(opponent);
      }

      this.teleportPhaseTimer--;
      if (this.teleportPhaseTimer <= 0) {
        this.teleportPhase = '';
        this.teleportOffset = 0;
        this.teleportPunchDone = false;
        this.attackTimer = 0;
        this.state = 'idle';
      }
    }
  }

  update(keys, opponent) {
    this.frame++;
    if (this.hitCooldown > 0) this.hitCooldown--;
    this.shakeX *= 0.8;
    this.shakeY *= 0.8;

    // Frozen state
    if (this.freezeTimer > 0) {
      this.freezeTimer -= PHYSICS.freezeTickMs; // ~60fps
      this.state = 'frozen';
      this.vx = 0;
      this.vy = 0;
      if (this.freezeTimer <= 0) {
        this.freezeTimer = 0;
        this.attackTimer = 0;
        this.lastAttackType = '';
        this.blockTimer = 0;
        this.isBlocking = false;
        this.state = 'idle';
      }
      return;
    }

    if (this.stunnedTimer > 0) {
      this.stunnedTimer -= PHYSICS.freezeTickMs;
      this.state = 'stunned';
      this.vx = 0;
      this.vy = 0;
      this.isBlocking = false;
      this.isCrouching = false;
      if (this.stunnedTimer <= 0) {
        this.stunnedTimer = 0;
        this.state = 'idle';
      }
      return;
    }

    if (this.harpoonLockTimer > 0) {
      this.harpoonLockTimer--;
      this.state = 'special';
      this.vx = 0;
      this.vy = 0;
      this.isBlocking = false;
      this.isCrouching = false;
      return;
    }

    if (this.teleportPhase) {
      this.updateSekdogTeleport(opponent);
      return;
    }

    if (this.borkoLeapActive) {
      this.updateBorkoSpecial(opponent);
      return;
    }

    // Face opponent
    if (this.attackTimer <= 0 && this.hitTimer <= 0) {
      this.facing = opponent.x > this.x ? 1 : -1;
    }

    // Timers
    if (this.attackTimer > 0) {
      this.attackTimer--;
      if (this.attackTimer <= 0) this.state = 'idle';
    }
    if (this.hitTimer > 0) {
      this.hitTimer--;
      if (this.hitTimer <= 0) this.state = 'idle';
    }
    if (this.blockTimer > 0) this.blockTimer--;

// Combo decay
if (Date.now() - this.lastHitTime > COMBAT.comboResetMs) this.comboCount = 0;

if (this.name === 'TREMODOG' && this.attackTimer > 0 && this.lastAttackType === 'special') {
  this.vx = 0;
  this.vy = 0;
  this.isCrouching = true;
  this.isBlocking = false;
  this.state = 'special';
  return;
}

// Movement (only if not attacking or hit)
const speed = this.speed;
    if (this.attackTimer <= 0 && this.hitTimer <= 0) {
      if (keys.left && !keys.right) {
        this.vx = -speed;
        this.state = this.isCrouching ? 'crouch' : 'walk';
      } else if (keys.right && !keys.left) {
        this.vx = speed;
        this.state = this.isCrouching ? 'crouch' : 'walk';
      } else {
        this.vx *= 0.7;
        if (Math.abs(this.vx) < 0.5) this.vx = 0;
        this.state = this.isCrouching ? 'crouch' : 'idle';
      }

      // Jump
      if (keys.up && this.onGround) {
        this.vy = PHYSICS.jumpVelocity;
        this.onGround = false;
      }

      // Crouch
      this.isCrouching = keys.down;
      if (this.isCrouching) this.state = 'crouch';

      // Block
      this.isBlocking = keys.block;
      if (this.isBlocking) this.state = 'block';
    }

    // Physics
    this.vy += PHYSICS.gravity;
    this.x += this.vx;
    this.y += this.vy;

    if (this.y >= GROUND) {
      this.y = GROUND;
      this.vy = 0;
      this.onGround = true;
    }

    // Boundaries
    this.x = Math.max(FIGHTER_LAYOUT.boundaryPadding, Math.min(W - FIGHTER_LAYOUT.boundaryPadding, this.x));

    // Passive special gain
    this.special = Math.min(SPECIAL_METER_MAX, this.special + this.specialGain);
  }

  draw() {
    // Determine state to render
    let state;
    if (this.victoryTimer > 0) {
      state = 'victory';
    } else if (this.defeatTimer > 0) {
      state = 'defeat';
    } else if (this.hitTimer > 0) {
      state = 'hit';
    } else if (this.harpoonLockTimer > 0) {
      state = 'special';
    } else if (this.stunnedTimer > 0) {
      state = 'stunned';
    } else if (this.attackTimer > 0) {
      state = this.state;
    } else {
      state = this.state;
    }

    const isFrozen = this.freezeTimer > 0;
    let sprite = createDogSprite(
      this.color1, this.color2, this.eyeColor,
      this.name, this.facing, this.frame, state, 1, isFrozen
    );

    if (this.health <= 0 && this.defeatTimer > 0) {
      sprite = tintSprite(sprite, 'rgba(0,0,0,0.3)');
    }

    const spriteSize = FIGHTER_LAYOUT.spriteSize * this.scale;
    const sx = this.x - spriteSize / 2 + this.shakeX;
    let sy = this.y - spriteSize + this.shakeY;

    if (this.teleportPhase) {
      sy += this.teleportOffset;
      ctx.globalAlpha = this.teleportPhase === 'descend'
        ? Math.max(0, 1 - this.teleportOffset / (H + spriteSize))
        : (this.teleportPhase === 'reappear'
          ? Math.min(1, 1 - this.teleportOffset / H)
          : 1);
    }

    ctx.drawImage(sprite, sx, sy, spriteSize, spriteSize);
    ctx.globalAlpha = 1;
  }
}

// Particles
const particles = [];

function addParticle(x, y, type) {
  if (type === 'hit') {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        life: 20,
        maxLife: 20,
        color: ['#f1c40f', '#e74c3c', '#fff'][Math.floor(Math.random() * 3)],
        size: 3 + Math.random() * 5,
        type: 'spark'
      });
    }
    particles.push({
      x, y, vx: 0, vy: 0, life: 15, maxLife: 15,
      text: 'BAM!', color: '#f1c40f', type: 'text'
    });
  } else if (type === 'block') {
    for (let i = 0; i < 4; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 12,
        maxLife: 12,
        color: '#74b9ff',
        size: 4,
        type: 'spark'
      });
    }
    particles.push({
      x, y, vx: 0, vy: 0, life: 12, maxLife: 12,
      text: 'BLOCK!', color: '#74b9ff', type: 'text'
    });
  } else if (type === 'ko') {
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      particles.push({
        x, y,
        vx: Math.cos(a) * (3 + Math.random() * 5),
        vy: Math.sin(a) * (3 + Math.random() * 5),
        life: 40,
        maxLife: 40,
        color: ['#f1c40f', '#e74c3c', '#fff', '#e67e22'][Math.floor(Math.random() * 4)],
        size: 4 + Math.random() * 6,
        type: 'spark'
      });
    }
  } else if (type === 'freeze') {
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      particles.push({
        x, y,
        vx: Math.cos(a) * (2 + Math.random() * 3),
        vy: Math.sin(a) * (2 + Math.random() * 3),
        life: 30,
        maxLife: 30,
        color: ['#87ceeb', '#fff', '#b0e0e6', '#e0ffff'][Math.floor(Math.random() * 4)],
        size: 3 + Math.random() * 4,
        type: 'spark'
      });
    }
    particles.push({
      x, y, vx: 0, vy: 0, life: 25, maxLife: 25,
      text: 'FROZEN!', color: '#87ceeb', type: 'text'
    });
  } else if (type === 'stunned') {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: -1 - Math.random() * 2,
        life: 24,
        maxLife: 24,
        color: ['#f1c40f', '#f39c12', '#fff'][Math.floor(Math.random() * 3)],
        size: 3 + Math.random() * 3,
        type: 'spark'
      });
    }
    particles.push({
      x, y, vx: 0, vy: 0, life: 24, maxLife: 24,
      text: 'STUNNED!', color: '#f39c12', type: 'text'
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life--;
    if (p.type === 'borkoShockwave') {
      if (p.life <= 0) particles.splice(i, 1);
      continue;
    }
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    if (p.type === 'borkoShockwave') {
      const progress = 1 - alpha;
      const radiusX = p.radius * (0.3 + progress * 0.7);
      const radiusY = 12 + progress * 16;
      const bandHeight = 14 + progress * 10;

      ctx.strokeStyle = '#74b9ff';
      ctx.lineWidth = 5 - progress * 2;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + 4, radiusX, radiusY, 0, Math.PI, 0, true);
      ctx.stroke();

      ctx.strokeStyle = '#dfe6e9';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + 4, radiusX * 0.82, radiusY * 0.65, 0, Math.PI, 0, true);
      ctx.stroke();

      ctx.fillStyle = `rgba(116, 185, 255, ${0.18 * alpha})`;
      ctx.fillRect(p.x - radiusX, p.y - bandHeight / 2, radiusX * 2, bandHeight);
    } else if (p.type === 'text') {
      ctx.fillStyle = p.color;
      ctx.font = `bold ${16 + (1 - alpha) * 10}px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y - (1 - alpha) * 20);
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size * alpha, p.size * alpha);
    }
    ctx.globalAlpha = 1;
  });
  ctx.textAlign = 'left';
}

// Projectiles
const projectiles = [];

function spawnProjectile(owner) {
  let color1, color2, type, speed, radius, dmg, kb;

  if (owner.name === 'SKORPDOG') {
    color1 = '#f1c40f';
    color2 = '#c8a800';
    type = 'harpoon';
    speed = 14;
    radius = 8;
    dmg = 15;
    kb = 5;
  } else if (owner.name === 'SEKDOG') {
    color1 = '#ff6b6b';
    color2 = '#c0392b';
    type = 'missile';
    speed = COMBAT.special.sekdog.missileSpeed;
    radius = COMBAT.special.sekdog.missileRadius;
    dmg = COMBAT.special.sekdog.missileDamage;
    kb = COMBAT.special.sekdog.missileKnockback;
  } else if (owner.name === 'BORKO') {
    return;
  } else if (owner.name === 'CYDOG') {
    color1 = '#2ecc71';
    color2 = '#27ae60';
    type = 'net';
    speed = COMBAT.special.cydog.netSpeed;
    radius = COMBAT.special.cydog.netRadius;
    dmg = 0;
    kb = 0;
    const bomb = spawnCydogBomb(owner);
    owner.pendingCydogBomb = bomb;
  } else if (owner.name === 'TREMODOG') {
    spawnTremdogShockwaveField(owner);
    return;
  } else if (owner.name === 'SUBDOG') {
    color1 = '#87ceeb';
    color2 = '#b0e0e6';
    type = 'snowflake';
    speed = 8;
    radius = 15;
    dmg = 0;
    kb = 0;
  } else if (isDoggoCage(owner.name)) {
    color1 = '#f1c40f';
    color2 = '#e74c3c';
    type = 'energy';
    speed = 10;
    radius = 18;
    dmg = 25;
    kb = 15;
  } else {
    color1 = '#3498db';
    color2 = '#9b59b6';
    type = 'energy';
    speed = 10;
    radius = 18;
    dmg = 25;
    kb = 15;
  }

  projectiles.push({
    x: owner.x + owner.facing * 40,
    y: owner.y - 50,
    vx: owner.facing * speed,
    vy: 0,
    owner: owner,
    dmg: dmg,
    kb: kb,
    life: 120,
    radius: radius,
    color1: color1,
    color2: color2,
    type: type,
    trail: [],
    hit: false,
    pullTimer: 0,
    rotation: 0,
    ownerAnchorX: owner.x,
    ownerAnchorY: owner.y,
    ownerAnchorFacing: owner.facing,
    bombAnchorX: owner.pendingCydogBomb ? owner.pendingCydogBomb.x : 0,
    bombAnchorY: owner.pendingCydogBomb ? owner.pendingCydogBomb.y : 0,
    fuseFrames: 0,
    exploded: false
  });

  owner.pendingCydogBomb = null;
}

function spawnCydogBomb(owner) {
  const special = COMBAT.special.cydog;
  const bomb = {
    x: owner.x + owner.facing * 84,
    y: owner.y - 34,
    vx: 0,
    vy: 0,
    owner,
    dmg: special.bombDamage,
    kb: special.bombKnockback,
    life: special.bombFuseFrames,
    radius: special.bombRadius,
    color1: '#f1c40f',
    color2: '#f39c12',
    type: 'bomb',
    trail: [],
    hit: true,
    pullTimer: 0,
    rotation: 0,
    ownerAnchorX: owner.x,
    ownerAnchorY: owner.y,
    ownerAnchorFacing: owner.facing,
    fuseFrames: special.bombFuseFrames,
    exploded: false
  };

  projectiles.push(bomb);
  return bomb;
}

function spawnTremdogShockwaveField(owner) {
  const special = COMBAT.special.tremdog;

  for (let i = projectiles.length - 1; i >= 0; i--) {
    if (projectiles[i].type === 'floorShockwave' && projectiles[i].owner === owner) {
      projectiles.splice(i, 1);
    }
  }

  projectiles.push({
    x: W / 2,
    y: GROUND - 6,
    vx: 0,
    vy: 0,
    owner,
    dmg: special.shockDamage,
    kb: special.shockKnockback,
    life: special.durationFrames,
    radius: 0,
    color1: '#ff7de9',
    color2: '#ff4fd8',
    type: 'floorShockwave',
    trail: [],
    hit: true,
    pullTimer: 0,
    rotation: 0,
    ownerAnchorX: owner.x,
    ownerAnchorY: owner.y,
    ownerAnchorFacing: owner.facing,
    fuseFrames: 0,
    exploded: false,
    pulseTimer: 1,
    pulseInterval: special.pulseIntervalFrames
  });
}

function updateProjectiles(opponent) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    const target = p.owner === p1 ? p2 : p1;
    p.life--;

    // Harpoon pull logic
    if (p.type === 'harpoon' && p.hit) {
      p.pullTimer++;
      const pullDir = p.owner.facing;
      p.owner.harpoonLockTimer = COMBAT.special.skorpdog.ownerLockFrames;
      p.owner.x = p.ownerAnchorX;
      p.owner.y = p.ownerAnchorY;
      p.owner.vx = 0;
      p.owner.vy = 0;

      // Pull opponent all the way into point-blank follow-up range.
      const targetX = getPointBlankTargetX(p.owner, target);
      const dx = targetX - target.x;
      const pullSpeed = 12;

      if (Math.abs(dx) > 5) {
        target.x += Math.sign(dx) * Math.min(pullSpeed, Math.abs(dx));
        target.vx = Math.sign(dx) * pullSpeed;
      } else {
        // Opponent is close enough, finish pull
        target.x = targetX;
        projectiles.splice(i, 1);
      }

      // Keep the harpoon visually lodged in the opponent so the chain retracts as they are reeled in.
      p.x = target.x - pullDir * (target.width / 2 - 6);
      p.y = target.y - 50;

      // Timeout safety for pathological cases only; allow long pulls to finish.
      if (p.pullTimer > 120) {
        projectiles.splice(i, 1);
      }
      continue;
    }

    if (p.type === 'net' && p.hit) {
      p.pullTimer++;
      const targetX = p.bombAnchorX - p.ownerAnchorFacing * (target.width / 2 + Math.max(12, COMBAT.special.cydog.bombRadius * 0.35));
      const dx = targetX - target.x;
      const pullSpeed = COMBAT.special.cydog.capturePullSpeed;

      if (Math.abs(dx) > 5) {
        target.x += Math.sign(dx) * Math.min(pullSpeed, Math.abs(dx));
        target.vx = 0;
        target.vy = 0;
      } else {
        target.x = targetX;
        target.vx = 0;
        target.vy = 0;
        projectiles.splice(i, 1);
      }

      p.x = target.x - p.ownerAnchorFacing * 12;
      p.y = target.y - 52;

      if (p.pullTimer > 150) {
        projectiles.splice(i, 1);
      }
      continue;
    }

    if (p.type === 'floorShockwave') {
      p.pulseTimer--;
      p.rotation += 0.08;

      if (p.pulseTimer <= 0) {
        p.pulseTimer = p.pulseInterval;

        if (target.health > 0 && target.onGround) {
          target.takeHit(p.dmg, p.kb, p.owner.facing);
          target.applyStunnedStatus(COMBAT.special.tremdog.shockStunMs);
          addParticle(target.x, target.y - 26, 'hit');
          addParticle(target.x, target.y - 26, 'stunned');
          game.screenShake = COMBAT.effects.projectileShake;
          game.hitStop = COMBAT.effects.projectileHitStop;
          if (target.health <= 0) playImpactSound('ko');
          else playImpactSound('hit');
        }
      }

      if (p.life <= 0) {
        projectiles.splice(i, 1);
      }
      continue;
    }

    if (p.type === 'bomb') {
      if (p.life <= 0 && !p.exploded) {
        p.exploded = true;
        const targetDistance = Math.hypot(target.x - p.x, target.y - 50 - p.y);
        if (targetDistance <= p.radius + target.width / 2) {
          target.takeHit(p.dmg, p.kb, p.owner.facing);
        }
        releaseCapturedOpponent(target);
        addParticle(p.x, p.y, 'ko');
        addParticle(p.x, p.y, 'hit');
        game.screenShake = COMBAT.effects.projectileShake;
        game.hitStop = COMBAT.effects.projectileHitStop;
        if (target.health <= 0) playImpactSound('ko');
        else playImpactSound('hit');
        projectiles.splice(i, 1);
      }
      continue;
    }

    p.x += p.vx;
    p.y += p.vy;

    // Trail
    p.trail.push({ x: p.x, y: p.y, life: p.type === 'harpoon' ? 8 : 15 });
    if (p.trail.length > (p.type === 'harpoon' ? 6 : 12)) p.trail.shift();
    p.trail.forEach(t => t.life--);
    p.trail = p.trail.filter(t => t.life > 0);

    // Out of bounds
    if (p.x < -50 || p.x > W + 50 || p.life <= 0) {
      projectiles.splice(i, 1);
      continue;
    }

    // Collision with opponent
    if (opponent !== p.owner && !p.hit) {
      const hb = opponent.getHurtbox();
      if (p.x > hb.x && p.x < hb.x + hb.w &&
          p.y > hb.y && p.y < hb.y + hb.h) {
        if (p.type === 'harpoon') {
          // Harpoon: hit and pull
          p.hit = true;
          p.vx = 0;
          p.vy = 0;
          p.pullTimer = 0;
          p.ownerAnchorX = p.owner.x;
          p.ownerAnchorY = p.owner.y;
          p.owner.vx = 0;
          p.owner.vy = 0;
          opponent.takeHit(p.dmg, p.kb, p.owner.facing);
          opponent.applyStunnedStatus(COMBAT.status.skorpdogStunMs);
          addParticle(p.x, p.y, 'hit');
          addParticle(opponent.x, opponent.y - 65, 'stunned');
          game.screenShake = COMBAT.effects.harpoonShake;
          game.hitStop = COMBAT.effects.harpoonHitStop;
          if (opponent.health <= 0) playImpactSound('ko');
        } else if (p.type === 'net') {
          p.hit = true;
          p.vx = 0;
          p.vy = 0;
          p.pullTimer = 0;
          p.ownerAnchorX = p.owner.x;
          p.ownerAnchorY = p.owner.y;
          p.ownerAnchorFacing = p.owner.facing;
          p.owner.attackTimer = 0;
          p.owner.state = 'idle';
          opponent.applyStunnedStatus(COMBAT.special.cydog.captureHoldMs);
          addParticle(p.x, p.y, 'stunned');
          game.screenShake = COMBAT.effects.freezeShake;
          game.hitStop = COMBAT.effects.freezeHitStop;
        } else if (p.type === 'snowflake') {
          // Snowflake: freeze opponent
          opponent.freezeTimer = 2000;
          opponent.attackTimer = 0;
          opponent.lastAttackType = '';
          opponent.blockTimer = 0;
          opponent.isBlocking = false;
          opponent.state = 'frozen';
          opponent.vx = 0;
          opponent.vy = 0;
          addParticle(p.x, p.y, 'freeze');
          playImpactSound('freeze');
          game.screenShake = COMBAT.effects.freezeShake;
          game.hitStop = COMBAT.effects.freezeHitStop;
          projectiles.splice(i, 1);
        } else {
          // Regular projectile / missile hit
          opponent.takeHit(p.dmg, p.kb, p.owner.facing);
          addParticle(p.x, p.y, 'hit');
          game.screenShake = COMBAT.effects.projectileShake;
          game.hitStop = COMBAT.effects.projectileHitStop;
          if (opponent.health <= 0) playImpactSound('ko');
          projectiles.splice(i, 1);
        }
      }
    }
  }
}

function drawProjectiles() {
  projectiles.forEach(p => {
    const alpha = Math.min(1, p.life / 20);

    if (p.type === 'harpoon') {
      const ownerX = p.owner.x;
      const ownerY = p.owner.y - 50;

      // Chain/rope from owner to harpoon
      ctx.globalAlpha = alpha * 0.9;
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 3;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(ownerX, ownerY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Chain links
      const dx = p.x - ownerX;
      const dy = p.y - ownerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const linkCount = Math.floor(dist / 12);
      ctx.fillStyle = '#aaa';
      for (let i = 1; i < linkCount; i++) {
        const t = i / linkCount;
        const lx = ownerX + dx * t;
        const ly = ownerY + dy * t;
        ctx.beginPath();
        ctx.arc(lx, ly, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Diamond tip
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#c0c0c0';
      ctx.beginPath();
      ctx.moveTo(p.x + 10, p.y);
      ctx.lineTo(p.x, p.y - 7);
      ctx.lineTo(p.x - 6, p.y);
      ctx.lineTo(p.x, p.y + 7);
      ctx.closePath();
      ctx.fill();

      // Diamond outline
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Diamond center highlight
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x + 1, p.y, 2, 0, Math.PI * 2);
      ctx.fill();

    } else if (p.type === 'snowflake') {
      // Snowflake projectile
      p.rotation += 0.05;
      
      // Trail
      p.trail.forEach(t => {
        const ta = (t.life / 15) * 0.3 * alpha;
        ctx.globalAlpha = ta;
        ctx.fillStyle = '#b0e0e6';
        ctx.beginPath();
        ctx.arc(t.x, t.y, p.radius * 0.4 * (t.life / 15), 0, Math.PI * 2);
        ctx.fill();
      });

      // Glow
      ctx.globalAlpha = alpha * 0.4;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 2.5);
      glow.addColorStop(0, '#87ceeb');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Snowflake arms
      ctx.globalAlpha = alpha;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      
      for (let i = 0; i < 6; i++) {
        ctx.save();
        ctx.rotate((i / 6) * Math.PI * 2);
        
        // Main arm
        ctx.fillStyle = '#fff';
        ctx.fillRect(-1, -p.radius, 2, p.radius);
        
        // Branches
        ctx.fillStyle = '#e0ffff';
        ctx.beginPath();
        ctx.moveTo(0, -p.radius * 0.7);
        ctx.lineTo(-4, -p.radius * 0.5);
        ctx.lineTo(0, -p.radius * 0.6);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, -p.radius * 0.7);
        ctx.lineTo(4, -p.radius * 0.5);
        ctx.lineTo(0, -p.radius * 0.6);
        ctx.fill();
        
        ctx.restore();
      }
      
      // Center crystal
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    } else if (p.type === 'missile') {
      p.rotation = Math.atan2(p.vy, p.vx || p.owner.facing);

      p.trail.forEach(t => {
        const ta = (t.life / 15) * 0.35 * alpha;
        ctx.globalAlpha = ta;
        ctx.fillStyle = '#ff9f43';
        ctx.beginPath();
        ctx.arc(t.x, t.y, p.radius * 0.75 * (t.life / 15), 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = alpha;

      ctx.fillStyle = '#dfe6e9';
      ctx.fillRect(-16, -4, 20, 8);
      ctx.beginPath();
      ctx.moveTo(4, -4);
      ctx.lineTo(12, 0);
      ctx.lineTo(4, 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-16, -5, 7, 10);
      ctx.fillStyle = '#111';
      ctx.fillRect(-4, -2, 5, 4);

      ctx.fillStyle = '#ffdd59';
      ctx.beginPath();
      ctx.moveTo(-16, 0);
      ctx.lineTo(-28 - Math.random() * 5, -5);
      ctx.lineTo(-23, 0);
      ctx.lineTo(-28 - Math.random() * 5, 5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    } else if (p.type === 'net') {
      p.rotation += 0.12;
      const target = p.owner === p1 ? p2 : p1;
      const capturedHurtbox = p.hit ? target.getHurtbox() : null;
      const netRadiusX = capturedHurtbox ? Math.max(p.radius, capturedHurtbox.w * 0.65) : p.radius;
      const netRadiusY = capturedHurtbox ? Math.max(p.radius, capturedHurtbox.h * 0.58) : p.radius;

      p.trail.forEach(t => {
        const ta = (t.life / 15) * 0.25 * alpha;
        ctx.globalAlpha = ta;
        ctx.strokeStyle = '#2ecc71';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, p.radius * 0.45 * (t.life / 15), 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#2ecc71';
      ctx.lineWidth = 3;

      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.beginPath();
        ctx.moveTo(-netRadiusX, 0);
        ctx.lineTo(netRadiusX, 0);
        ctx.stroke();
      }

      ctx.strokeStyle = '#7bed9f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, netRadiusX * 0.95, netRadiusY * 0.95, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (p.type === 'bomb') {
      const fuseProgress = 1 - p.life / p.fuseFrames;

      ctx.globalAlpha = 0.25 + fuseProgress * 0.2;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 1.7);
      glow.addColorStop(0, '#ffe66d');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * 1.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = alpha;
      const grad = ctx.createRadialGradient(p.x - 6, p.y - 8, 2, p.x, p.y, p.radius);
      grad.addColorStop(0, '#fff7b2');
      grad.addColorStop(0.35, '#f1c40f');
      grad.addColorStop(1, '#d68910');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * 0.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#7b241c';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = fuseProgress > 0.7 ? '#2ecc71' : '#f39c12';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - p.radius * 0.6);
      ctx.quadraticCurveTo(p.x + 6, p.y - p.radius - 8, p.x + 14, p.y - p.radius - 2);
      ctx.stroke();

      ctx.fillStyle = '#2ecc71';
      ctx.beginPath();
      ctx.arc(p.x + 14, p.y - p.radius - 2, 3 + Math.sin(Date.now() * 0.02) * 1.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === 'floorShockwave') {
      const pulseAlpha = 0.2 + (0.5 + Math.sin(Date.now() * 0.04) * 0.5) * 0.35;
      const band = ctx.createLinearGradient(0, GROUND - 24, 0, GROUND + 18);
      band.addColorStop(0, 'rgba(255, 125, 233, 0)');
      band.addColorStop(0.35, 'rgba(255, 125, 233, 0.35)');
      band.addColorStop(1, 'rgba(255, 79, 216, 0)');

      ctx.globalAlpha = pulseAlpha;
      ctx.fillStyle = band;
      ctx.fillRect(0, GROUND - 24, W, 32);

      ctx.globalAlpha = 0.65 + Math.sin(Date.now() * 0.06) * 0.2;
      ctx.strokeStyle = '#ff7de9';
      ctx.lineWidth = 4;
      for (let i = 0; i < 6; i++) {
        const cx = (i + 0.5) * (W / 6);
        const radiusX = 58 + Math.sin(p.rotation + i * 0.8) * 12;
        const radiusY = 12 + Math.cos(p.rotation + i * 0.5) * 4;
        ctx.beginPath();
        ctx.ellipse(cx, GROUND + 2, radiusX, radiusY, 0, Math.PI, 0, true);
        ctx.stroke();
      }

      ctx.globalAlpha = 0.75;
      ctx.strokeStyle = '#ff4fd8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND - 2);
      for (let x = 0; x <= W; x += 24) {
        const waveY = GROUND - 2 - Math.sin((x / 40) + p.rotation * 4) * 6;
        ctx.lineTo(x, waveY);
      }
      ctx.stroke();
    } else {
      // Regular energy ball projectile
      // Trail
      p.trail.forEach(t => {
        const ta = (t.life / 15) * 0.4 * alpha;
        ctx.globalAlpha = ta;
        ctx.fillStyle = p.color2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, p.radius * 0.6 * (t.life / 15), 0, Math.PI * 2);
        ctx.fill();
      });

      // Glow
      const flashGreen = p.owner && p.owner.name === 'SHAO CATNIP' && Math.sin(Date.now() * 0.03) > 0;
      const flashColor1 = flashGreen ? '#7bed9f' : '#2ecc71';
      const flashColor2 = flashGreen ? '#2ecc71' : '#27ae60';
      ctx.globalAlpha = alpha * 0.3;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 2);
      glow.addColorStop(0, p.owner && p.owner.name === 'CATNIP' ? flashColor1 : p.color1);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * 2, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.globalAlpha = alpha;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.3, p.owner && p.owner.name === 'CATNIP' ? flashColor1 : p.color1);
      grad.addColorStop(0.7, p.owner && p.owner.name === 'CATNIP' ? flashColor2 : p.color2);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Sparks
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2 + Date.now() * 0.01;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * 6, p.y + Math.sin(a) * 6);
        ctx.lineTo(p.x + Math.cos(a) * (p.radius + 4), p.y + Math.sin(a) * (p.radius + 4));
        ctx.stroke();
      }
    }

    ctx.globalAlpha = 1;
  });
}

// Background
function drawCloud(cx, cy, scale, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff6df';
  ctx.beginPath();
  ctx.ellipse(cx - 34 * scale, cy + 5 * scale, 34 * scale, 20 * scale, 0, 0, Math.PI * 2);
  ctx.ellipse(cx, cy - 4 * scale, 46 * scale, 26 * scale, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + 40 * scale, cy + 7 * scale, 32 * scale, 18 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawForestBand(baseY, color, highlight, seed, heightScale) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(0, baseY);
  for (let x = 0; x <= W + 32; x += 16) {
    const wave = Math.sin((x + seed) * 0.025) * 10 + Math.cos((x + seed) * 0.06) * 7;
    const crown = Math.sin((x + seed) * 0.11) * 6;
    ctx.lineTo(x, baseY + wave - crown - heightScale);
  }
  ctx.lineTo(W, GROUND);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = highlight;
  ctx.lineWidth = 2;
  for (let x = 14; x <= W; x += 48) {
    const trunkTop = baseY - 16 - ((x + seed) % 18);
    ctx.beginPath();
    ctx.moveTo(x, baseY + 8);
    ctx.lineTo(x, trunkTop);
    ctx.stroke();
  }
}

function drawTempleRoof(cx, topY, width, height, roofColor, trimColor) {
  const left = cx - width / 2;
  const right = cx + width / 2;
  const ridgeY = topY;
  const eaveY = topY + height;

  ctx.fillStyle = roofColor;
  ctx.beginPath();
  ctx.moveTo(left - 28, eaveY + 10);
  ctx.quadraticCurveTo(left - 8, eaveY + 22, left + 16, eaveY);
  ctx.lineTo(cx - width * 0.18, ridgeY + 14);
  ctx.lineTo(cx, ridgeY - 10);
  ctx.lineTo(cx + width * 0.18, ridgeY + 14);
  ctx.lineTo(right - 16, eaveY);
  ctx.quadraticCurveTo(right + 8, eaveY + 22, right + 28, eaveY + 10);
  ctx.lineTo(right + 8, eaveY + 30);
  ctx.lineTo(left - 8, eaveY + 30);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = trimColor;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.strokeStyle = '#5a1d1a';
  ctx.lineWidth = 2;
  for (let x = left + 20; x <= right - 20; x += 18) {
    ctx.beginPath();
    ctx.moveTo(x, eaveY + 4);
    ctx.lineTo(x + 10, ridgeY + 16);
    ctx.stroke();
  }

  ctx.fillStyle = trimColor;
  ctx.fillRect(cx - 6, ridgeY - 18, 12, 22);
}

function drawKanineLogo(x, cx, cy, scale = 1, palette = {}) {
  const {
    ring = '#e74c3c',
    main = '#e74c3c',
    lower = '#c0392b',
    innerEar = '#f1948a',
    snout = '#f5b7b1',
    eyeWhite = '#fff',
    pupil = '#f1c40f',
    nose = '#2b2b2b',
    mouth = '#7b241c'
  } = palette;

  x.save();

  x.strokeStyle = ring;
  x.lineWidth = 8 * scale;
  x.beginPath();
  x.arc(cx, cy, 56 * scale, 0, Math.PI * 2);
  x.stroke();

  x.fillStyle = lower;
  x.beginPath();
  x.ellipse(cx - 9 * scale, cy + 31 * scale, 26 * scale, 25 * scale, 0, 0, Math.PI * 2);
  x.fill();

  x.fillStyle = main;
  x.beginPath();
  x.ellipse(cx + 7 * scale, cy - 6 * scale, 23 * scale, 21 * scale, 0, 0, Math.PI * 2);
  x.fill();

  x.beginPath();
  x.ellipse(cx - 8 * scale, cy - 28 * scale, 9 * scale, 15 * scale, -0.35, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.ellipse(cx + 20 * scale, cy - 26 * scale, 8 * scale, 13 * scale, 0.35, 0, Math.PI * 2);
  x.fill();

  x.fillStyle = innerEar;
  x.beginPath();
  x.ellipse(cx - 5 * scale, cy - 27 * scale, 4 * scale, 8 * scale, -0.35, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.ellipse(cx + 19 * scale, cy - 25 * scale, 3.5 * scale, 7 * scale, 0.35, 0, Math.PI * 2);
  x.fill();

  x.fillStyle = snout;
  x.beginPath();
  x.ellipse(cx + 18 * scale, cy, 15 * scale, 11 * scale, 0, 0, Math.PI * 2);
  x.fill();

  x.fillStyle = eyeWhite;
  x.beginPath();
  x.ellipse(cx + 3 * scale, cy - 16 * scale, 7 * scale, 8 * scale, 0, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.ellipse(cx + 15 * scale, cy - 16 * scale, 6 * scale, 7 * scale, 0, 0, Math.PI * 2);
  x.fill();

  x.fillStyle = pupil;
  x.beginPath();
  x.ellipse(cx + 5 * scale, cy - 15 * scale, 3.8 * scale, 4.8 * scale, 0, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.ellipse(cx + 17 * scale, cy - 15 * scale, 3.2 * scale, 4.2 * scale, 0, 0, Math.PI * 2);
  x.fill();

  x.fillStyle = nose;
  x.beginPath();
  x.ellipse(cx + 25 * scale, cy - 7 * scale, 4.5 * scale, 3.5 * scale, 0, 0, Math.PI * 2);
  x.fill();

  x.strokeStyle = mouth;
  x.lineWidth = 2 * scale;
  x.beginPath();
  x.arc(cx + 18 * scale, cy + 1 * scale, 6 * scale, 0.2, Math.PI - 0.1);
  x.stroke();

  x.restore();
}

const BACKGROUND_STAGES = {
  BORKO_LAIR: 'borkoLair',
  NIGHT_CITY: 'nightCity',
  TEMPLE: 'temple'
};

function pickRandomBackgroundStage() {
  const stages = [BACKGROUND_STAGES.BORKO_LAIR, BACKGROUND_STAGES.NIGHT_CITY, BACKGROUND_STAGES.TEMPLE];
  return stages[Math.floor(Math.random() * stages.length)];
}

function drawTempleDoorLogo(x, y, w, h) {
  drawKanineLogo(ctx, x + w / 2, y + h / 2, 0.72, {
    ring: '#111111',
    main: '#1f1f1f',
    lower: '#161616',
    innerEar: '#404040',
    snout: '#565656',
    eyeWhite: '#d8d8d8',
    pupil: '#0a0a0a',
    nose: '#000000',
    mouth: '#000000'
  });
}

function drawBuilding(x, y, w, h) {
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#251535';
  ctx.fillRect(x + 5, y + 5, w - 10, h - 5);

  // Window flicker is derived from the building rect so lights stay attached to that facade.
  ctx.fillStyle = '#f1c40f';
  for (let wx = x + 12; wx <= x + w - 18; wx += 14) {
    for (let wy = y + 14; wy <= y + h - 22; wy += 24) {
      const flicker = 0.55 + Math.sin(Date.now() * 0.001 + wx * 0.2 + wy * 0.08) * 0.18;
      const lit = Math.sin(wx * 12.9898 + wy * 78.233) > -0.2;
      if (!lit) continue;
      ctx.globalAlpha = flicker;
      ctx.fillRect(wx, wy, 8, 12);
    }
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle = '#1a1025';
}

function drawNightCityBackground() {

  ctx.fillRect(0, 0, W, GROUND);

  ctx.fillStyle = '#f5f5dc';
  ctx.beginPath();
  ctx.arc(850, 80, 40, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a0a2e';
  ctx.beginPath();
  ctx.arc(865, 72, 35, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const sx = (i * 137 + 50) % W;
    const sy = (i * 89 + 20) % (GROUND - 100);
    const ss = (Math.sin(Date.now() * 0.001 + i) + 1) * 1.2;
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.002 + i * 0.5) * 0.3;
    ctx.fillRect(sx, sy, ss, ss);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#1a1025';
  drawBuilding(50, GROUND - 200, 60, 200);
  drawBuilding(140, GROUND - 260, 80, 260);
  drawBuilding(260, GROUND - 180, 50, 180);
  drawBuilding(700, GROUND - 220, 70, 220);
  drawBuilding(810, GROUND - 280, 90, 280);

  const groundGrad = ctx.createLinearGradient(0, GROUND, 0, H);

  groundGrad.addColorStop(0.3, '#1a1a1a');
  groundGrad.addColorStop(1, '#111');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, GROUND, W, H - GROUND);

  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(W, GROUND);
  ctx.stroke();

  ctx.fillStyle = '#333';
  for (let i = 0; i < W; i += 40) {
    ctx.fillRect(i, GROUND + 5, 20, 2);
  }
}

function drawTempleBackground() {

  skyGrad.addColorStop(0.45, '#a9daf7');
  skyGrad.addColorStop(0.78, '#f0cf8c');

  sunGlow.addColorStop(0.45, 'rgba(255, 220, 140, 0.55)');
  sunGlow.addColorStop(1, 'rgba(255, 220, 140, 0)');

  ctx.beginPath();

  ctx.fillStyle = '#ffe29a';

  ctx.beginPath();

  for (let x = 0; x <= W; x += 40) {
    const ridgeY = 236 + Math.sin(x * 0.012) * 18 + Math.cos(x * 0.026) * 12;
    ctx.lineTo(x, ridgeY);

  ctx.lineTo(W, GROUND);

  drawForestBand(304, '#547b45', '#415f34', 12, 12);
  drawForestBand(338, '#3f6337', '#2f4c29', 90, 20);

  const templeCenterX = W / 2;

  ctx.fillStyle = '#d9c6a1';

  ctx.fillStyle = '#8d1f1d';
  for (let i = -2; i <= 2; i++) {
    const columnX = templeCenterX + i * 92 - 14;

  ctx.fillStyle = '#b89466';
  ctx.fillRect(templeCenterX - 146, templeBaseY + 74, 292, 98);
  ctx.fillStyle = '#724829';
  ctx.fillRect(templeCenterX - 132, templeBaseY + 74, 264, 98);
  ctx.fillStyle = '#57331d';
  ctx.fillRect(templeCenterX - 4, templeBaseY + 74, 8, 98);

  ctx.strokeStyle = '#916038';
  ctx.lineWidth = 3;
  for (let y = templeBaseY + 84; y <= templeBaseY + 162; y += 18) {
    ctx.beginPath();
    ctx.moveTo(templeCenterX - 126, y);
    ctx.lineTo(templeCenterX + 126, y);
    ctx.stroke();
  }
  for (let x = templeCenterX - 114; x <= templeCenterX + 114; x += 28) {
    ctx.beginPath();
    ctx.moveTo(x, templeBaseY + 76);
    ctx.lineTo(x, templeBaseY + 170);
    ctx.stroke();
  }

  ctx.fillStyle = '#d8b36a';
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 6; col++) {
      const studX = templeCenterX - 96 + col * 38;
      const studY = templeBaseY + 92 + row * 20;
      ctx.beginPath();
      ctx.arc(studX, studY, 3, 0, Math.PI * 2);
      ctx.arc(studX + 152, studY, 3, 0, Math.PI * 2);

  drawTempleDoorLogo(templeCenterX - 132, templeBaseY + 74, 264, 98);

  ctx.fillRect(templeCenterX - 204, templeBaseY + 174, 408, 18);
  ctx.fillStyle = '#7c5d40';
  ctx.fillRect(templeCenterX - 232, templeBaseY + 192, 464, 22);

  const groundGrad = ctx.createLinearGradient(0, GROUND, 0, H);
  groundGrad.addColorStop(0, '#8f7b5a');
  groundGrad.addColorStop(0.42, '#65513e');
  groundGrad.addColorStop(1, '#413328');

  for (let y = GROUND + 8; y <= H; y += 16) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y - 6);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(219, 196, 151, 0.18)';
  for (let x = 18; x <= W; x += 46) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND + 2);
    ctx.lineTo(x + 20, H);
    ctx.stroke();
  }
