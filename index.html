function isCpuMode() {
  return game.mode === MATCH_MODES.CPU;
}

function isBattlePlanMode() {
  return game.mode === MATCH_MODES.BATTLE_PLAN;
}

function isCpuControlledMode() {
  return isCpuMode() || isBattlePlanMode();
}

function getCharacterById(id) {
  return CHARACTERS.find(char => char.id === id) || CHARACTERS[0];
}

function shuffleCharacterIds(ids) {
  const arr = [...ids];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function resetBattlePlanState() {
  game.battlePlan.route = [];
  game.battlePlan.currentIndex = 0;
  game.battlePlan.playerCharacterId = '';
  game.battlePlan.pendingAdvance = false;
  game.battlePlan.cleared = false;
  game.battlePlan.stepperFromIndex = -1;
  game.battlePlan.stepperReady = false;
  hideBattlePlanStepper();
}

function buildBattlePlanRoute(playerCharacterId) {
  const route = shuffleCharacterIds(
    CHARACTERS
      .map(char => char.id)
      .filter(id => id !== playerCharacterId && id !== 'borko' && id !== 'catnip')
  );

  if (playerCharacterId !== 'borko') route.push(playerCharacterId);
  route.push('borko');
  route.push('catnip');
  return route;
}

function prepareBattlePlanRoute(playerCharacterId) {
  game.battlePlan.playerCharacterId = playerCharacterId;
  game.battlePlan.route = buildBattlePlanRoute(playerCharacterId);
  game.battlePlan.currentIndex = 0;
  game.battlePlan.pendingAdvance = false;
  game.battlePlan.cleared = false;
  p2Selection = CHARACTERS.findIndex(char => char.id === game.battlePlan.route[0]);
}

function getBattlePlanCurrentOpponent() {
  const id = game.battlePlan.route[game.battlePlan.currentIndex];
  return getCharacterById(id);
}

function loadBattlePlanMatch() {
  const playerChar = getCharacterById(game.battlePlan.playerCharacterId);
  const opponentChar = getBattlePlanCurrentOpponent();
  game.stage = opponentChar.id === 'borko'
    ? BACKGROUND_STAGES.BORKO_LAIR
    : pickRandomBackgroundStage();

  p1 = new Fighter(PLAYER_SPAWNS.p1, playerChar, 1);
  p2 = new Fighter(PLAYER_SPAWNS.p2, opponentChar, -1);
  p1Selection = CHARACTERS.findIndex(char => char.id === playerChar.id);
  p2Selection = CHARACTERS.findIndex(char => char.id === opponentChar.id);
  ui.p1Name.textContent = p1.name;
  ui.p2Name.textContent = `${p2.name} CPU`;
  updateRoundDots();
}

function buildBattlePlanStepPortrait(char, container) {
  container.innerHTML = '';
  container.appendChild(cloneCanvas(renderCharPreview(char)));
}

function getBattlePlanStepMeta(char, index) {
  if (index === game.battlePlan.route.length - 1) {
    return { badge: 'FINAL', note: 'SHAO CATNIP showdown' };
  }

  if (index === game.battlePlan.route.length - 2 && char.id === 'borko') {
    return { badge: 'SUB-BOSS', note: 'BORKO blockade' };
  }

  if (char.id === game.battlePlan.playerCharacterId) {
    return { badge: 'MIRROR', note: 'Face yourself' };
  }

  return { badge: `MATCH ${index + 1}`, note: 'CPU opponent' };
}

function buildBattlePlanStepper() {
  const playerChar = getCharacterById(game.battlePlan.playerCharacterId);
  const nextOpponent = getBattlePlanCurrentOpponent();
  const clearedCount = game.battlePlan.currentIndex;

  ui.battlePlanRouteSteps.innerHTML = '';
  ui.battlePlanPlayerToken.innerHTML = '';

  game.battlePlan.route.forEach((id, index) => {
    const char = getCharacterById(id);
    const meta = getBattlePlanStepMeta(char, index);
    const step = document.createElement('div');
    let cls = 'battle-plan-step';
    if (index < game.battlePlan.currentIndex) cls += ' completed';
    else if (index === game.battlePlan.currentIndex) cls += ' next';
    else cls += ' locked';
    step.className = cls;
    step.dataset.stepIndex = index;

    const badge = document.createElement('div');
    badge.className = 'battle-plan-badge';
    badge.textContent = meta.badge;

    const portrait = document.createElement('div');
    portrait.className = 'battle-plan-step-portrait';
    buildBattlePlanStepPortrait(char, portrait);

    const name = document.createElement('div');
    name.className = 'battle-plan-step-name';
    name.textContent = char.name;

    const note = document.createElement('div');
    note.className = 'battle-plan-step-note';
    note.textContent = index < game.battlePlan.currentIndex ? 'CLEARED' : meta.note;

    step.appendChild(badge);
    step.appendChild(portrait);
    step.appendChild(name);
    step.appendChild(note);
    ui.battlePlanRouteSteps.appendChild(step);
  });

  const playerCard = document.createElement('div');
  playerCard.className = 'battle-plan-player-card';
  buildBattlePlanStepPortrait(playerChar, playerCard);
  ui.battlePlanPlayerToken.appendChild(playerCard);

  ui.battlePlanSummary.innerHTML = clearedCount === 0
    ? `Plan locked in.<br>First opponent: ${nextOpponent.name}`
    : `Match ${clearedCount} cleared.<br>Next opponent: ${nextOpponent.name}`;

  ui.battlePlanPrompt.textContent = 'Scanning route...';
  ui.battlePlanPrompt.classList.remove('ready');
}

function getBattlePlanTokenPosition(index) {
  const steps = ui.battlePlanRouteSteps.querySelectorAll('.battle-plan-step');
  if (!steps.length) return { left: 0, top: 0 };

  const routeRect = ui.battlePlanRoute.getBoundingClientRect();
  const firstRect = steps[0].getBoundingClientRect();
  const sampleRect = steps[Math.min(1, steps.length - 1)].getBoundingClientRect();
  const gap = steps.length > 1 ? sampleRect.left - firstRect.left : 140;

  let rect = firstRect;
  let left = rect.left - routeRect.left + rect.width / 2;
  if (index < 0) {
    left -= gap * 0.7;
  } else {
    rect = steps[index].getBoundingClientRect();
    left = rect.left - routeRect.left + rect.width / 2;
  }

  return {
    left,
    top: firstRect.top - routeRect.top - 96
  };
}

function setBattlePlanTokenPosition(index, animate) {
  const pos = getBattlePlanTokenPosition(index);
  ui.battlePlanPlayerToken.style.transition = animate
    ? 'left 0.85s cubic-bezier(0.22, 1, 0.36, 1), top 0.85s cubic-bezier(0.22, 1, 0.36, 1)'
    : 'none';
  ui.battlePlanPlayerToken.style.left = `${pos.left}px`;
  ui.battlePlanPlayerToken.style.top = `${pos.top}px`;
}

function hideBattlePlanStepper() {

function showBattlePlanStepper(fromIndex, toIndex) {
  game.state = GAME_STATES.BATTLE_PLAN_STEPPER;
  game.battlePlan.stepperFromIndex = fromIndex;
  game.battlePlan.stepperReady = false;
  buildBattlePlanStepper();
  ui.battlePlanStepper.style.display = 'flex';
  syncMusicMode();

  requestAnimationFrame(() => {
    setBattlePlanTokenPosition(fromIndex, false);

        game.battlePlan.stepperReady = true;
        ui.battlePlanPrompt.textContent = 'Press SPACE to start the next match';
        ui.battlePlanPrompt.classList.add('ready');
      }, 900);
    });
  });

function queueNextBattlePlanMatch() {
  game.battlePlan.currentIndex++;
  game.battlePlan.pendingAdvance = true;
  game.battlePlan.stepperFromIndex = game.battlePlan.currentIndex - 1;
  game.round = 1;
  p1.roundsWon = 0;

}

function advanceBattlePlanMatch() {
  game.battlePlan.pendingAdvance = false;
  hideBattlePlanStepper();
  loadBattlePlanMatch();
  startRound();
}

function proceedBattlePlanStepper() {
  if (game.state !== GAME_STATES.BATTLE_PLAN_STEPPER || !game.battlePlan.stepperReady) return;

  playUiSound('confirm');
  if (game.battlePlan.pendingAdvance) {
    advanceBattlePlanMatch();
  } else {
    hideBattlePlanStepper();
    startRound();
  }
}

function pauseTrackForOverlay(track, key) {
  audio.pausedTracks[key] = Boolean(track && !track.paused);
  if (audio.pausedTracks[key]) track.pause();
}

function pauseAudioForOverlay() {
  pauseTrackForOverlay(audio.titleTrack, 'title');
  pauseTrackForOverlay(audio.charSelectTrack, 'charSelect');
  pauseTrackForOverlay(audio.fightTrack, 'fight');

  audio.pauseSuspendedContext = Boolean(audio.context && audio.context.state === 'running');
  if (audio.pauseSuspendedContext) audio.context.suspend();
}

function resumeAudioFromOverlay() {
  if (audio.pauseSuspendedContext && audio.context && audio.context.state === 'suspended') {
    audio.context.resume();
  }

  if (audio.pausedTracks.title && audio.titleTrack) playTrack(audio.titleTrack);
  if (audio.pausedTracks.charSelect && audio.charSelectTrack) playTrack(audio.charSelectTrack);
  if (audio.pausedTracks.fight && audio.fightTrack) playTrack(audio.fightTrack);

  audio.pausedTracks.title = false;
  audio.pausedTracks.charSelect = false;
  audio.pausedTracks.fight = false;
  audio.pauseSuspendedContext = false;
}

function hidePauseOverlay() {

  game.pause.active = false;

}

function resumePausedSession() {
  if (!game.pause.active) return;

  const returnState = game.pause.returnState;
  hidePauseOverlay();
  game.state = returnState;
  resumeAudioFromOverlay();

function leavePausedSessionForMode(mode) {

function updateCpuInput(cpuFighter, opponent) {
  resetInputState(keys2);

  if (cpuFighter.health <= 0 || opponent.health <= 0 || cpuFighter.hitTimer > 0 || cpuFighter.freezeTimer > 0 || cpuFighter.teleportPhase) return;

  cpuState.attackCooldown = Math.max(0, cpuState.attackCooldown - 1);
  cpuState.blockFrames = Math.max(0, cpuState.blockFrames - 1);
  cpuState.retreatFrames = Math.max(0, cpuState.retreatFrames - 1);
  cpuState.jumpCooldown = Math.max(0, cpuState.jumpCooldown - 1);

  const dx = opponent.x - cpuFighter.x;
  const absDistance = Math.abs(dx);
  const towardLeft = dx < 0;
  const closeRange = absDistance < 82;
  const midRange = absDistance >= 82 && absDistance < 180;

  if (opponent.attackTimer > 0 && closeRange && Math.random() > 0.45) {
    cpuState.blockFrames = 10 + Math.floor(Math.random() * 8);
  }

  if (cpuState.blockFrames > 0) {
    keys2.block = true;
    if (closeRange && Math.random() > 0.5) keys2.down = true;
    return;
  }

  if (cpuState.retreatFrames > 0) {
    keys2.left = !towardLeft;
    keys2.right = towardLeft;
    if (cpuState.jumpCooldown === 0 && Math.random() > 0.9) {
      keys2.up = true;
      cpuState.jumpCooldown = 45;
    }
    return;
  }

  if (cpuState.attackCooldown === 0) {
    if (cpuFighter.special >= SPECIAL_METER_MAX && midRange && Math.random() > 0.7) {
      cpuFighter.attack('special');
      cpuState.attackCooldown = 55;
      cpuState.retreatFrames = 12;
      return;
    }

    if (closeRange) {
      if (Math.random() > 0.55) cpuFighter.attack('kick');
      else cpuFighter.attack('punch');
      cpuState.attackCooldown = 18 + Math.floor(Math.random() * 18);
      if (Math.random() > 0.7) cpuState.retreatFrames = 14;
      return;
    }
  }

  if (absDistance > 58) {
    keys2.left = towardLeft;
    keys2.right = !towardLeft;
  } else {
    keys2.left = towardLeft ? cpuState.strafeBias < 0 : cpuState.strafeBias > 0;
    keys2.right = !keys2.left;
    if (Math.random() > 0.96) cpuState.strafeBias *= -1;
  }

  if (cpuState.jumpCooldown === 0 && midRange && Math.random() > 0.985) {
    keys2.up = true;
    cpuState.jumpCooldown = 70;
  }

  if (closeRange && Math.random() > 0.985) {
    keys2.down = true;
  }
}

// Character select screen
function cloneCanvas(src) {
  const c = document.createElement('canvas');
  c.width = src.width;
  c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}

function tintSprite(src, fillStyle) {
  const c = cloneCanvas(src);
  const x = c.getContext('2d');
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = fillStyle;
  x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-over';
  return c;
}

function renderCharPreview(char) {
  return createDogSprite(char.color1, char.color2, char.eyeColor, char.name, 1, 0, 'idle');
}

function buildTitleLogo() {

  c.width = 140;
  c.height = 140;
  const x = c.getContext('2d');

  drawKanineLogo(x, 70, 70, 1);

}

function updatePortrait(char, container) {

function buildCharSelect() {

  ui.charPool.innerHTML = '';

  CHARACTERS.forEach((char, i) => {

  updateCharSelect();

function updateCharSelect() {
  ui.p1Portrait.className = 'char-portrait p1 selected';
  ui.p2Portrait.className = 'char-portrait p2 selected';

  CHARACTERS.forEach((char, i) => {
    const opt = document.getElementById('char-opt-' + i);
    if (!opt) return;
    let cls = 'char-option';
    if (i === p1Selection) cls += ' highlight-p1';
    if (i === p2Selection) cls += ' highlight-p2';
    if (i === p1Selection && p1Confirmed) cls += ' confirmed-p1';
    if (i === p2Selection && p2Confirmed) cls += ' confirmed-p2';
    opt.className = cls;
  });

  updatePortrait(CHARACTERS[p1Selection], ui.p1Portrait);
  updatePortrait(CHARACTERS[p2Selection], ui.p2Portrait);
}

function confirmSelection() {
  if (selectionConfirmTimer) {
    clearTimeout(selectionConfirmTimer);
    selectionConfirmTimer = null;
  }

  if (isBattlePlanMode()) {
    if (!game.battlePlan.route.length || game.battlePlan.playerCharacterId !== CHARACTERS[p1Selection].id) {
      prepareBattlePlanRoute(CHARACTERS[p1Selection].id);
    }
    loadBattlePlanMatch();
  } else {
    game.stage = pickRandomBackgroundStage();
    p1 = new Fighter(PLAYER_SPAWNS.p1, CHARACTERS[p1Selection], 1);
    p2 = new Fighter(PLAYER_SPAWNS.p2, CHARACTERS[p2Selection], -1);
    ui.p1Name.textContent = p1.name;
    ui.p2Name.textContent = isCpuControlledMode() ? `${p2.name} CPU` : p2.name;
  }

  ui.charSelect.style.display = 'none';
  playUiSound('confirm');
  if (isBattlePlanMode()) {
    showBattlePlanStepper(-1, game.battlePlan.currentIndex);
    startGameLoop();
    return;
  }

  startRound();
  startGameLoop();
}

function checkHit(attacker, defender) {
  const atkBox = attacker.getAttackBox();
  if (!atkBox) return;

  const defBox = defender.getHurtbox();

  const actualAtkBox = {
    x: attacker.facing === 1 ? attacker.x + COMBAT.attackBox.forwardOffset : attacker.x - COMBAT.attackBox.backwardOffset,
    y: atkBox.y,
    w: atkBox.w,
    h: atkBox.h
  };

  if (actualAtkBox.x < defBox.x + defBox.w &&
      actualAtkBox.x + actualAtkBox.w > defBox.x &&
      actualAtkBox.y < defBox.y + defBox.h &&
      actualAtkBox.y + actualAtkBox.h > defBox.y) {
    defender.takeHit(atkBox.dmg, atkBox.kb, attacker.facing);
    if (!(attacker.name === 'SKORPDOG' || attacker.name === 'SUBDOG' || attacker.name === 'SEKDOG' || attacker.name === 'CYDOG' || attacker.name === 'TREMODOG') || attacker.lastAttackType === 'special') {
      attacker.special = Math.min(SPECIAL_METER_MAX, attacker.special + atkBox.dmg * COMBAT.meter.onHitMultiplier);
    }
    attacker.comboCount++;
    attacker.lastHitTime = Date.now();

    if (defender.health <= 0) {
      game.screenShake = COMBAT.effects.koShake;
      addParticle(defender.x, defender.y - 50, 'ko');
      playImpactSound('ko');
    } else {
      game.screenShake = COMBAT.effects.hitShake;
    }

    game.hitStop = COMBAT.effects.meleeHitStop;
  }
}

function startRound() {
  p1.reset(PLAYER_SPAWNS.p1);
  p2.reset(PLAYER_SPAWNS.p2);
  resetInputState(keys1);
  resetInputState(keys2);
  resetCpuState();
  game.timer = ROUND_RULES.timerSeconds;
  game.state = GAME_STATES.COUNTDOWN;
  game.countdownPhase = COUNTDOWN_PHASES.ROUND;
  game.countdownTimer = ROUND_RULES.introRoundFrames;
  game.countdownFightTimer = ROUND_RULES.introFightFrames;
  audio.readyCues.p1 = false;
  audio.readyCues.p2 = false;
  projectiles.length = 0;
  particles.length = 0;

  if (game.timerInterval) clearInterval(game.timerInterval);

  syncMusicMode();
  if (audio.supported) restartFightTrack();
  playRoundCue('round');
}

function startTimer() {
  if (game.timerInterval) clearInterval(game.timerInterval);
  game.timerInterval = setInterval(() => {
    if (game.state === GAME_STATES.FIGHT) {
      game.timer--;
      if (game.timer <= 0) {
        game.timer = 0;
        endRound();
      }
    }
  }, 1000);
}

function endRound() {
  game.state = GAME_STATES.ROUND_END;
  game.roundMessageTimer = ROUND_RULES.roundMessageFrames;

  if (game.timerInterval) clearInterval(game.timerInterval);

  syncMusicMode();

  let winner = null;
  let loser = null;
  if (p1.health <= 0 && p2.health > 0) { winner = p2; loser = p1; }
  else if (p2.health <= 0 && p1.health > 0) { winner = p1; loser = p2; }
  else if (p1.health > p2.health) { winner = p1; loser = p2; }
  else if (p2.health > p1.health) { winner = p2; loser = p1; }

  if (winner) {
    winner.roundsWon++;
    updateRoundDots();
    const flawless = winner.health >= ROUND_RULES.flawlessHealth;
    const battlePlanMatchComplete = isBattlePlanMode() && winner.roundsWon >= ROUND_RULES.winsToFinish;
    if (battlePlanMatchComplete && winner === p1 && game.battlePlan.currentIndex === game.battlePlan.route.length - 1) {
      game.roundMessage = 'BATTLE PLAN\nCLEARED!';
    } else if (battlePlanMatchComplete && winner === p2) {
      game.roundMessage = 'BATTLE PLAN\nFAILED';
    } else {
      game.roundMessage = flawless ? `${winner.name}\nFLAWLESS VICTORY!` : `${winner.name} WINS!`;
    }
    playRoundCue('win');

    // Set victory pose for winner
    winner.victoryTimer = ROUND_RULES.roundMessageFrames;
    winner.state = 'victory';

    // Set defeat pose for loser
    if (loser) {
      loser.defeatTimer = ROUND_RULES.roundMessageFrames;
      loser.state = 'defeat';
    }

    if (winner.roundsWon >= ROUND_RULES.winsToFinish) {
      if (isBattlePlanMode() && winner === p1 && game.battlePlan.currentIndex < game.battlePlan.route.length - 1) {
        queueNextBattlePlanMatch();
        return;
      }

      game.state = GAME_STATES.GAME_OVER;
      game.roundMessageTimer = ROUND_RULES.gameOverMessageFrames;
      if (isBattlePlanMode() && winner === p1) game.battlePlan.cleared = true;
      return;
    }
  } else {
    game.roundMessage = 'DRAW!';
    playRoundCue('draw');
  }

  game.round++;
}

function updateRoundDots() {
  ui.roundDots.p1r1.className = 'round-dot' + (p1.roundsWon >= 1 ? ' won-p1' : '');
  ui.roundDots.p1r2.className = 'round-dot' + (p1.roundsWon >= 2 ? ' won-p1' : '');
  ui.roundDots.p2r1.className = 'round-dot' + (p2.roundsWon >= 1 ? ' won-p2' : '');
  ui.roundDots.p2r2.className = 'round-dot' + (p2.roundsWon >= 2 ? ' won-p2' : '');
}

function updateUI() {
  ui.p1Health.style.width = p1.health + '%';
  ui.p2Health.style.width = p2.health + '%';
  ui.p1Special.style.width = p1.special + '%';
  ui.p2Special.style.width = p2.special + '%';
  ui.timer.textContent = game.timer;

  // Blinking effect when special is ready
  ui.p1Special.classList.toggle('ready', p1.special >= SPECIAL_METER_MAX);
  ui.p2Special.classList.toggle('ready', p2.special >= SPECIAL_METER_MAX);

  if (p1.special >= SPECIAL_METER_MAX && !audio.readyCues.p1) {
    audio.readyCues.p1 = true;
    playRoundCue('meter');
  } else if (p1.special < SPECIAL_METER_MAX) {
    audio.readyCues.p1 = false;
  }

  if (p2.special >= SPECIAL_METER_MAX && !audio.readyCues.p2) {
    audio.readyCues.p2 = true;
    playRoundCue('meter');
  } else if (p2.special < SPECIAL_METER_MAX) {
    audio.readyCues.p2 = false;
  }

  // Combo counter display
  const now = Date.now();

  if (p1.comboCount >= 2 && now - p1.lastHitTime < COMBAT.comboResetMs) {
    ui.p1Combo.textContent = p1.comboCount + '-HIT COMBO';
    ui.p1Combo.classList.add('active');
  } else {
    ui.p1Combo.classList.remove('active');
  }

  if (p2.comboCount >= 2 && now - p2.lastHitTime < COMBAT.comboResetMs) {
    ui.p2Combo.textContent = p2.comboCount + '-HIT COMBO';
    ui.p2Combo.classList.add('active');
  } else {
    ui.p2Combo.classList.remove('active');
  }
}

// Main game loop
function gameLoop() {
  requestAnimationFrame(gameLoop);

  if (game.state === GAME_STATES.PAUSED) {
    ctx.save();
    if (game.pause.snapshotCanvas) ctx.drawImage(game.pause.snapshotCanvas, 0, 0);
    ctx.restore();
    return;
  }

  if (game.hitStop > 0) {
    game.hitStop--;
    return;
  }

  // Screen shake
  ctx.save();
  if (game.screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * game.screenShake,
      (Math.random() - 0.5) * game.screenShake
    );
    game.screenShake *= 0.85;
    if (game.screenShake < 0.5) game.screenShake = 0;
  }

  drawBackground();

  if (game.state === GAME_STATES.FIGHT) {
    p1.update(keys1, p2);
    if (isCpuControlledMode()) updateCpuInput(p2, p1);
    p2.update(keys2, p1);
    checkHit(p1, p2);
    checkHit(p2, p1);
    updateProjectiles(p2);
    updateProjectiles(p1);

    if (p1.health <= 0 || p2.health <= 0) {
      endRound();
    }
  } else if (game.state === GAME_STATES.COUNTDOWN) {
    if (game.countdownPhase === COUNTDOWN_PHASES.ROUND) {
      game.countdownTimer--;
      if (game.countdownTimer <= 0) {
        game.countdownPhase = COUNTDOWN_PHASES.FIGHT;
        playRoundCue('fight');
      }
    } else if (game.countdownPhase === COUNTDOWN_PHASES.FIGHT) {
      game.countdownFightTimer--;
      if (game.countdownFightTimer <= 0) {
        game.state = GAME_STATES.FIGHT;
        startTimer();
      }
    }
  } else if (game.state === GAME_STATES.ROUND_END || game.state === GAME_STATES.GAME_OVER) {
    game.roundMessageTimer--;

    // Update victory/defeat animations
    if (p1.victoryTimer > 0) {
      p1.victoryTimer--;
      p1.frame++;
    }
    if (p2.victoryTimer > 0) {
      p2.victoryTimer--;
      p2.frame++;
    }
    if (p1.defeatTimer > 0) {
      p1.defeatTimer--;
      p1.frame++;
    }
    if (p2.defeatTimer > 0) {
      p2.defeatTimer--;
      p2.frame++;
    }

    if (game.roundMessageTimer <= 0 && game.state === GAME_STATES.ROUND_END) {
      if (isBattlePlanMode() && game.battlePlan.pendingAdvance) {
        showBattlePlanStepper(game.battlePlan.stepperFromIndex, game.battlePlan.currentIndex);
      } else {
        startRound();
      }
    }
  }

  updateParticles();

  p1.draw();
  p2.draw();
  drawProjectiles();
  drawParticles();

  // Draw countdown
  if (game.state === GAME_STATES.COUNTDOWN) {
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 72px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let text;
    let timer;
    if (game.countdownPhase === COUNTDOWN_PHASES.ROUND) {
      text = `Round ${game.round}`;
      timer = game.countdownTimer;
    } else {
      text = 'FIGHT!';
      timer = game.countdownFightTimer;
    }

    const introDuration = game.countdownPhase === COUNTDOWN_PHASES.ROUND
      ? ROUND_RULES.introRoundFrames
      : ROUND_RULES.introFightFrames;
    const scale = 1 + (timer / introDuration) * 0.3;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 50);
    ctx.scale(scale, scale);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 6;
    ctx.strokeText(text, 0, 0);
    ctx.fillText(text, 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // Draw round message
  if ((game.state === GAME_STATES.ROUND_END || game.state === GAME_STATES.GAME_OVER) && game.roundMessageTimer > 0) {
    const msgAlpha = Math.min(1, game.roundMessageTimer / 30);
    ctx.globalAlpha = msgAlpha;
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 36px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const lines = game.roundMessage.split('\n');
    lines.forEach((line, i) => {
      const y = H / 2 - 30 + i * 50;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 5;
      ctx.strokeText(line, W / 2, y);
      ctx.fillText(line, W / 2, y);
    });

    if (game.state === GAME_STATES.GAME_OVER && game.roundMessageTimer < ROUND_RULES.restartPromptFrames) {
      ctx.font = '14px "Press Start 2P", monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText('Press SPACE to play again', W / 2, H / 2 + 80);
    }

    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  updateUI();
  ctx.restore();
}

// Restart - go back to character select
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') {
    if (game.state === GAME_STATES.CHAR_SELECT) {
      openTitleScreen();
      return;
    }

    if (game.state === GAME_STATES.FIGHT) {
      showPauseOverlay(GAME_STATES.FIGHT);
      return;
    }

    if (game.state === GAME_STATES.BATTLE_PLAN_STEPPER) {
      showPauseOverlay(GAME_STATES.BATTLE_PLAN_STEPPER);
      return;
    }

    if (game.state === GAME_STATES.PAUSED) {
      resumePausedSession();
      return;
    }
  }

  if (e.code === 'Space' && game.state === GAME_STATES.BATTLE_PLAN_STEPPER) {
    ensureAudioReady();
    proceedBattlePlanStepper();
  }

  if (e.code === 'Space' && game.state === GAME_STATES.GAME_OVER && game.roundMessageTimer < ROUND_RULES.restartPromptFrames) {
    ensureAudioReady();
    openCharacterSelect(true);
  }
});

// Prevent scroll
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
});
</script>
</body>
